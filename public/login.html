<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · LuminaSaber</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">

    <script src="/js/auth.js"></script>
    <script>redirecionarSeAutenticado();</script>

    <style>
        :root {
            --lemon-chiffon: #fbf8cc; --powder-petal: #fde4cf; --cotton-rose: #ffcfd2;
            --pink-orchid: #f1c0e8; --mauve: #cfbaf0; --baby-blue-ice: #a3c4f3;
            --frosted-blue: #90dbf4; --electric-aqua: #8eecf5; --aquamarine: #98f5e1;
            --celadon: #b9fbc0; --ink: #16323d;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0; min-height: 100vh; font-family: 'DM Sans', sans-serif;
            background: radial-gradient(circle at 80% 20%, #21e8e8 0%, #00e1e1 45%, #00cfcf 100%);
            display: flex; justify-content: center; align-items: center;
            padding: 40px 20px; color: var(--ink); position: relative; overflow-x: hidden;
        }

        .blob { position: fixed; border-radius: 50%; filter: blur(2px); opacity: 0.5; pointer-events: none; z-index: 0; }
        .blob.b1 { width: 220px; height: 220px; background: var(--mauve); top: -60px; left: -50px; }
        .blob.b2 { width: 180px; height: 180px; background: var(--celadon); bottom: -60px; right: -40px; }
        .blob.b3 { width: 130px; height: 130px; background: var(--lemon-chiffon); bottom: 12%; left: -40px; }

        .doodle { position: fixed; pointer-events: none; z-index: 0; opacity: .85; animation: flutuar 6s ease-in-out infinite; }
        .doodle svg { width: 100%; height: 100%; }
        .d1 { width: 28px; height: 28px; top: 14%; left: 10%; animation-duration: 5s; }
        .d2 { width: 22px; height: 22px; top: 18%; right: 14%; animation-duration: 7s; animation-delay: .5s; }
        .d3 { width: 34px; height: 34px; bottom: 16%; right: 10%; animation-duration: 6s; animation-delay: 1s; }
        @keyframes flutuar { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(8deg); } }

        .cartao {
            position: relative; z-index: 1;
            background: #fff; border-radius: 24px; padding: 44px 40px;
            width: min(92vw, 440px); box-shadow: 0 16px 36px rgba(0,0,0,0.16);
            text-align: center;
        }
        .cartao .kicker {
            font-family: 'Caveat', cursive; font-size: 24px; font-weight: 600;
            color: #2a8f80; margin: 0 0 2px;
        }
        .cartao h1 { font-size: 26px; font-weight: 800; margin: 0 0 28px; }

        form { display: grid; gap: 16px; text-align: left; }
        .field { display: flex; flex-direction: column; }
        .field label { font-size: 12.5px; font-weight: 700; color: rgba(22,50,61,0.65); margin-bottom: 6px; }
        input {
            padding: 14px 16px; border-radius: 12px; border: 2px solid #e6ecee;
            font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
            background: #f7fafb; transition: border-color .15s, background-color .15s;
        }
        input:focus { border-color: var(--baby-blue-ice); background: #fff; }

        button {
            margin-top: 6px; padding: 14px; background-color: var(--ink); color: #fff;
            border: none; border-radius: 999px; font-size: 15px; font-weight: 700;
            cursor: pointer; font-family: 'DM Sans', sans-serif; transition: opacity .2s;
        }
        button:hover { opacity: 0.85; }

        .link-cadastro { margin-top: 20px; font-size: 13.5px; color: rgba(22,50,61,0.75); }
        .link-cadastro a { color: var(--ink); font-weight: 700; text-decoration: underline; }

        #mensagem { margin-top: 14px; font-weight: 700; font-size: 13.5px; min-height: 18px; }
    </style>
</head>

<body>
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="doodle d1"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.4 6.9L21 11l-6.6 2.1L12 20l-2.4-6.9L3 11l6.6-2.1z"/></svg></span>
    <span class="doodle d2"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg></span>
    <span class="doodle d3"><svg viewBox="0 0 24 24" fill="#f1c0e8"><circle cx="12" cy="12" r="10"/></svg></span>

    <div class="cartao">
        <p class="kicker">Que bom te ver de novo!</p>
        <h1>Entrar na sua conta</h1>

        <form id="formLogin">
            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="voce@email.com" required>
            </div>

            <div class="field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>

            <button type="submit">Entrar</button>
        </form>

        <p id="mensagem"></p>

        <div class="link-cadastro">
            Ainda não tem conta? <a href="/cadastro">Cadastre-se</a>
        </div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const msg = document.getElementById('mensagem');

            if (!email || !senha) {
                msg.style.color = '#b00020';
                msg.textContent = 'Preencha e-mail e senha.';
                return;
            }

            try {
                const res = await fetch('/api/usuarios/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const dados = await res.json();

                if (res.ok) {
                    salvarSessao(dados.token, dados.usuario);
                    msg.style.color = '#1a7f37';
                    msg.textContent = 'Login realizado com sucesso!';
                    setTimeout(() => window.location.replace('/painel'), 600);
                } else {
                    msg.style.color = '#b00020';
                    msg.textContent = dados.error || 'Falha ao fazer login.';
                }
            } catch (err) {
                msg.style.color = '#b00020';
                msg.textContent = 'Não foi possível conectar ao servidor.';
            }
        });
    </script>
</body>
</html>
