<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Histórico · LuminaSaber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="/js/auth.js"></script>
    <script>protegerPagina();</script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; font-family: 'DM Sans', sans-serif;
            background-color: #00e1e1; padding: 32px 20px 60px;
            color: #16323d;
        }
        .wrapper { max-width: 760px; margin: 0 auto; }

        .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .voltar {
            display: inline-block; font-weight: 700; font-size: 14px; color: #16323d;
            text-decoration: none; background: #bbbeff; border: 2px solid #000;
            padding: 8px 18px; border-radius: 999px; transition: background-color .15s;
        }
        .voltar:hover { background-color: #a7abff; }

        .banner {
            background-color: #b8ecd9; border-radius: 14px; padding: 16px 24px;
            margin-bottom: 24px;
        }
        .banner h1 { margin: 0; font-size: 24px; font-weight: 700; }
        .banner p { margin: 4px 0 0; font-size: 14px; color: #2a5049; }

        .lista { display: grid; gap: 12px; }
        .card {
            background: #fff; border-radius: 14px; padding: 18px 22px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            display: flex; justify-content: space-between; align-items: center; gap: 16px;
        }
        .card .conteudo p { margin: 0 0 4px; font-size: 14px; line-height: 1.4; }
        .card .conteudo .materia { font-weight: 700; color: #16323d; }
        .card .conteudo small { color: #8a9aa0; font-size: 12px; }

        .status {
            font-weight: 700; padding: 6px 16px; border-radius: 999px;
            font-size: 12px; white-space: nowrap; flex-shrink: 0;
        }
        .status.acertou { background: #d4f7dc; color: #1a7f37; }
        .status.errou { background: #ffdede; color: #b00020; }

        .vazio {
            background: rgba(255,255,255,0.85); padding: 28px; border-radius: 14px;
            text-align: center; font-weight: 600; color: #2a5049;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="topo">
            <a class="voltar" href="/painel">Painel</a>
        </div>

        <div class="banner">
            <h1>Meu histórico</h1>
            <p>A questão mais recente que você respondeu fica sempre no topo.</p>
        </div>

        <div class="lista" id="lista"><p class="vazio">Carregando...</p></div>
    </div>

    <script>
        (async function carregarHistorico() {
            const lista = document.getElementById('lista');
            try {
                const res = await fetchAutenticado('/api/historico');
                const historico = await res.json();

                if (!res.ok) {
                    lista.innerHTML = `<p class="vazio">${historico.error || 'Não foi possível carregar seu histórico.'}</p>`;
                    return;
                }
                if (historico.length === 0) {
                    lista.innerHTML = '<p class="vazio">Você ainda não respondeu nenhuma questão.</p>';
                    return;
                }

                lista.innerHTML = historico.map(h => `
                    <div class="card">
                        <div class="conteudo">
                            <p><span class="materia">${h.questao.materia}</span> — ${h.questao.enunciado}</p>
                            <small>${h.data_resposta}</small>
                        </div>
                        <span class="status ${h.status === 'Acertou' ? 'acertou' : 'errou'}">${h.status}</span>
                    </div>
                `).join('');
            } catch (err) {
                lista.innerHTML = '<p class="vazio">Não foi possível conectar ao servidor.</p>';
            }
        })();
    </script>
</body>
</html>
