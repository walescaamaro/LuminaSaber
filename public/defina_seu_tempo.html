<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defina seu Tempo · LuminaSaber</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">

<style>
:root {
    --lemon-chiffon: #fbf8cc; --powder-petal: #fde4cf; --cotton-rose: #ffcfd2;
    --pink-orchid: #f1c0e8; --mauve: #cfbaf0; --baby-blue-ice: #a3c4f3;
    --frosted-blue: #90dbf4; --electric-aqua: #8eecf5; --aquamarine: #98f5e1;
    --celadon: #b9fbc0; --ink: #16323d;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0; min-height: 100vh; font-family: 'DM Sans', sans-serif;
    background: radial-gradient(circle at 75% 20%, #21e8e8 0%, #00e1e1 45%, #00cfcf 100%);
    display: flex; justify-content: center; align-items: center;
    padding: 40px 18px; color: var(--ink); position: relative; overflow-x: hidden;
}

.blob { position: fixed; border-radius: 50%; filter: blur(2px); opacity: .5; pointer-events: none; z-index: 0; }
.blob.b1 { width: 230px; height: 230px; background: var(--pink-orchid); top: -60px; left: -60px; }
.blob.b2 { width: 180px; height: 180px; background: var(--aquamarine); bottom: -60px; right: -50px; }

.doodle { position: fixed; pointer-events: none; z-index: 0; opacity: .85; animation: flutuar 6s ease-in-out infinite; }
.doodle svg { width: 100%; height: 100%; }
.d1 { width: 26px; height: 26px; top: 14%; right: 14%; animation-duration: 5.5s; }
.d2 { width: 22px; height: 22px; bottom: 16%; left: 10%; animation-duration: 7s; animation-delay: .5s; }
@keyframes flutuar { 0%,100% { transform: translateY(0) rotate(0);} 50% { transform: translateY(-14px) rotate(8deg);} }

.container {
    position: relative; z-index: 1; text-align: center;
    width: min(94vw, 560px); background: #fff; border-radius: 24px;
    padding: 40px 36px; box-shadow: 0 16px 36px rgba(0,0,0,0.16);
}

.icone-relogio {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 18px;
    background: var(--frosted-blue); display: flex; align-items: center; justify-content: center;
}
.icone-relogio svg { width: 28px; height: 28px; stroke: var(--ink); }

.kicker { font-family: 'Caveat', cursive; font-size: 24px; font-weight: 600; color: #2a8f80; margin: 0 0 2px; }
h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px; }
.sub { font-size: 14px; color: rgba(22,50,61,0.65); margin: 0 0 26px; }

.tempo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; }

.tempo-btn {
    border: 3px solid transparent; border-radius: 16px; padding: 18px 10px;
    font-size: 15px; font-weight: 700; font-family: 'DM Sans', sans-serif;
    cursor: pointer; transition: transform .15s, box-shadow .15s; color: var(--ink);
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}
.tempo-btn:hover { transform: translateY(-2px); }
.tempo-btn.selected { border-color: var(--ink); box-shadow: 0 6px 16px rgba(0,0,0,0.16); }

.t1 { background: var(--baby-blue-ice); }
.t2 { background: var(--pink-orchid); }
.t3 { background: var(--celadon); }
.t4 { background: var(--mauve); }

.tempo-btn.personalizar {
    grid-column: span 2; background: #f7fafb; border: 3px dashed #d7e0e3; color: rgba(22,50,61,0.75);
    box-shadow: none;
}
.tempo-btn.personalizar.selected { border-style: solid; border-color: var(--ink); background: var(--lemon-chiffon); color: var(--ink); }

/* Picker personalizado */
.picker-wrap {
    grid-column: span 2; display: none; flex-direction: column; align-items: center; gap: 14px;
    padding: 20px; background: #f7fafb; border-radius: 16px; margin-top: 4px; animation: fadeIn .25s ease;
}
.picker-wrap.visible { display: flex; }

.picker-row { display: flex; gap: 12px; align-items: flex-end; justify-content: center; flex-wrap: wrap; }
.picker-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.picker-col label { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; color: rgba(22,50,61,0.55); }

.spinner { display: flex; flex-direction: column; align-items: center; }
.spin-btn {
    width: 58px; height: 26px; background: #fff; border: 1.5px solid #e6ecee;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background-color .15s;
}
.spin-btn svg { width: 14px; height: 14px; stroke: var(--ink); }
.spin-btn:hover { background: var(--lemon-chiffon); }
.spin-btn.up { border-radius: 10px 10px 0 0; border-bottom: none; }
.spin-btn.down { border-radius: 0 0 10px 10px; border-top: none; }

.spin-value {
    width: 58px; height: 44px; background: #fff; border: 1.5px solid #e6ecee;
    border-top: none; border-bottom: none; font-size: 20px; font-weight: 800;
    text-align: center; font-family: 'DM Sans', sans-serif; outline: none; color: var(--ink);
    -moz-appearance: textfield;
}
.spin-value::-webkit-outer-spin-button, .spin-value::-webkit-inner-spin-button { -webkit-appearance: none; }

.picker-divider { font-size: 24px; font-weight: 700; padding-bottom: 12px; opacity: .4; }
.picker-preview { font-size: 13.5px; font-weight: 700; color: rgba(22,50,61,0.65); min-height: 18px; }

button.pronto {
    margin-top: 28px; padding: 14px 60px; font-size: 15px; font-weight: 700; border: none;
    border-radius: 999px; cursor: pointer; background-color: var(--ink); color: #fff;
    font-family: 'DM Sans', sans-serif; transition: opacity .2s;
}
button.pronto:hover { opacity: 0.85; }

.error-msg {
    margin-top: 16px; font-weight: 700; font-size: 13px; color: #b00020;
    background: #ffe3e6; border-radius: 10px; padding: 8px 16px; display: none;
}
.error-msg.visible { display: block; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 480px) {
    .container { padding: 32px 22px; }
    button.pronto { width: 100%; }
}
</style>
</head>
<body>
<span class="blob b1"></span>
<span class="blob b2"></span>
<span class="doodle d1"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.4 6.9L21 11l-6.6 2.1L12 20l-2.4-6.9L3 11l6.6-2.1z"/></svg></span>
<span class="doodle d2"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg></span>

<div class="container">
    <span class="icone-relogio">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    </span>

    <p class="kicker">Vamos organizar</p>
    <h1>Defina seu tempo</h1>
    <p class="sub">Quanto tempo você quer dedicar aos estudos agora?</p>

    <div class="tempo-grid" id="tempoGrid">
        <button class="tempo-btn t1" data-s="900"  onclick="selecionarTempo(this)">15 minutos</button>
        <button class="tempo-btn t2" data-s="2700" onclick="selecionarTempo(this)">45 minutos</button>
        <button class="tempo-btn t3" data-s="1800" onclick="selecionarTempo(this)">30 minutos</button>
        <button class="tempo-btn t4" data-s="3600" onclick="selecionarTempo(this)">1 hora</button>

        <button class="tempo-btn personalizar" id="btnPersonalizar" onclick="togglePersonalizar()">
            Personalizar...
        </button>

        <div class="picker-wrap" id="pickerWrap">
            <div class="picker-row">
                <div class="picker-col">
                    <label>HORAS</label>
                    <div class="spinner">
                        <button class="spin-btn up" onclick="spin('h', 1)">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
                        </button>
                        <input class="spin-value" id="val-h" type="number" min="0" max="99" value="0" oninput="clamp(this,0,99);atualizarPreview()">
                        <button class="spin-btn down" onclick="spin('h', -1)">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                        </button>
                    </div>
                </div>

                <span class="picker-divider">:</span>

                <div class="picker-col">
                    <label>MINUTOS</label>
                    <div class="spinner">
                        <button class="spin-btn up" onclick="spin('m', 1)">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
                        </button>
                        <input class="spin-value" id="val-m" type="number" min="0" max="59" value="0" oninput="clamp(this,0,59);atualizarPreview()">
                        <button class="spin-btn down" onclick="spin('m', -1)">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                        </button>
                    </div>
                </div>

                <span class="picker-divider">:</span>

                <div class="picker-col">
                    <label>SEGUNDOS</label>
                    <div class="spinner">
                        <button class="spin-btn up" onclick="spin('s', 1)">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
                        </button>
                        <input class="spin-value" id="val-s" type="number" min="0" max="59" value="0" oninput="clamp(this,0,59);atualizarPreview()">
                        <button class="spin-btn down" onclick="spin('s', -1)">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <p class="picker-preview" id="pickerPreview">Defina um tempo acima</p>
        </div>
    </div>

    <p class="error-msg" id="errorMsg">Selecione um tempo antes de continuar!</p>

    <button class="pronto" onclick="confirmarTempo()">Pronto</button>
</div>

<script>
  let tempoSegundos = null;
  let pickerAberto  = false;

  function selecionarTempo(btn) {
    if (pickerAberto) fecharPicker();
    document.querySelectorAll('.tempo-btn:not(.personalizar)')
            .forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    tempoSegundos = parseInt(btn.dataset.s);
    esconderErro();
  }

  function togglePersonalizar() {
    pickerAberto ? fecharPicker() : abrirPicker();
  }

  function abrirPicker() {
    pickerAberto = true;
    document.querySelectorAll('.tempo-btn:not(.personalizar)')
            .forEach(b => b.classList.remove('selected'));
    tempoSegundos = null;
    document.getElementById('btnPersonalizar').classList.add('selected');
    document.getElementById('pickerWrap').classList.add('visible');
    ['h','m','s'].forEach(id => {
      document.getElementById('val-'+id).value = 0;
    });
    atualizarPreview();
  }

  function fecharPicker() {
    pickerAberto = false;
    document.getElementById('btnPersonalizar').classList.remove('selected');
    document.getElementById('pickerWrap').classList.remove('visible');
    if (!document.querySelector('.tempo-btn:not(.personalizar).selected')) {
      tempoSegundos = null;
    }
  }

  function spin(campo, delta) {
    const el = document.getElementById('val-' + campo);
    const max = campo === 'h' ? 99 : 59;
    let val = parseInt(el.value) || 0;
    val += delta;
    if (val < 0) val = max;
    if (val > max) val = 0;
    el.value = val;
    atualizarPreview();
  }

  function clamp(el, min, max) {
    let v = parseInt(el.value);
    if (isNaN(v)) v = min;
    if (v < min) v = min;
    if (v > max) v = max;
    el.value = v;
  }

  function atualizarPreview() {
    const h = parseInt(document.getElementById('val-h').value) || 0;
    const m = parseInt(document.getElementById('val-m').value) || 0;
    const s = parseInt(document.getElementById('val-s').value) || 0;
    const total = h*3600 + m*60 + s;

    const prev = document.getElementById('pickerPreview');
    if (total === 0) {
      prev.textContent = 'Defina um tempo acima';
      tempoSegundos = null;
    } else {
      const partes = [];
      if (h) partes.push(h + (h === 1 ? ' hora' : ' horas'));
      if (m) partes.push(m + ' min');
      if (s) partes.push(s + ' seg');
      prev.textContent = partes.join(' e ');
      tempoSegundos = total;
    }
    esconderErro();
  }

  function confirmarTempo() {
    if (!tempoSegundos || tempoSegundos <= 0) {
      document.getElementById('errorMsg').textContent = 'Selecione ou defina um tempo antes de continuar!';
      document.getElementById('errorMsg').classList.add('visible');
      return;
    }
    localStorage.setItem('tempoEstudoSegundos', tempoSegundos);
    window.location.href = '/meta';
  }

  function esconderErro() {
    document.getElementById('errorMsg').classList.remove('visible');
  }
</script>
</body>
</html>
