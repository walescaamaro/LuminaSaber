<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel · LuminaSaber</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">

    <script src="/js/auth.js"></script>
    <script>protegerPagina();</script>
    <script src="/js/estrelas.js"></script>

    <style>
        :root {
            --lemon-chiffon: #fbf8cc;
            --powder-petal: #fde4cf;
            --cotton-rose: #ffcfd2;
            --pink-orchid: #f1c0e8;
            --mauve: #cfbaf0;
            --baby-blue-ice: #a3c4f3;
            --frosted-blue: #90dbf4;
            --electric-aqua: #8eecf5;
            --aquamarine: #98f5e1;
            --celadon: #b9fbc0;
            --ink: #16323d;

            --bg-app: radial-gradient(circle at 20% 15%, #5fe3d9 0%, #4fd1c5 45%, #3fc0b8 100%);
            --bg-card: #fffdf8;
            --text-main: var(--ink);
            --text-muted: rgba(22,50,61,0.65);
            --icone-caixa-bg: rgba(255,255,255,0.65);
            --sombra-card: 0 14px 32px rgba(0,0,0,0.14);
            --sombra-cartao: 0 10px 22px rgba(0,0,0,0.12);
            --sombra-cartao-hover: 0 16px 30px rgba(0,0,0,0.18);
            --divisor: rgba(255,255,255,0.35);
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0; min-height: 100vh; font-family: 'DM Sans', sans-serif;
            background: var(--bg-app);
            color: var(--text-main);
            position: relative; overflow-x: hidden;
            transition: background-color .2s, color .2s;
            padding-bottom: 90px;
        }

        /* ── Decoração de fundo ── */
        .blob {
            position: fixed; border-radius: 50%; filter: blur(2px);
            opacity: 0.45; pointer-events: none; z-index: 0;
        }
        .blob.b1 { width: 260px; height: 260px; background: var(--celadon); top: -80px; left: -60px; }
        .blob.b2 { width: 200px; height: 200px; background: var(--pink-orchid); bottom: -70px; right: -50px; }
        .blob.b3 { width: 150px; height: 150px; background: var(--lemon-chiffon); bottom: 10%; left: -50px; }
        .blob.b4 { width: 180px; height: 180px; background: var(--baby-blue-ice); top: 8%; right: -60px; }

        .doodle {
            position: fixed; pointer-events: none; z-index: 0; opacity: 0.85;
            animation: flutuar 6s ease-in-out infinite;
        }
        .doodle svg { width: 100%; height: 100%; }
        .d1 { width: 34px; height: 34px; top: 12%; left: 8%; animation-duration: 5s; }
        .d2 { width: 26px; height: 26px; top: 20%; right: 12%; animation-duration: 7s; animation-delay: .6s; }
        .d3 { width: 40px; height: 40px; bottom: 18%; right: 8%; animation-duration: 6.5s; animation-delay: 1.2s; }
        .d4 { width: 24px; height: 24px; bottom: 12%; left: 12%; animation-duration: 5.5s; animation-delay: .3s; }
        .d5 { width: 20px; height: 20px; top: 6%; left: 42%; animation-duration: 8s; animation-delay: .9s; }

        @keyframes flutuar {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-16px) rotate(10deg); }
        }

        /* ── Barra superior ── */
        .barra-topo {
            position: relative; z-index: 2;
            display: flex; align-items: center; justify-content: space-between;
            max-width: 980px; margin: 0 auto; padding: 24px 20px 0;
        }

        .btn-sair {
            border: 2px solid var(--text-main); background: var(--bg-card); color: var(--text-main);
            padding: 10px 22px; border-radius: 999px; font-weight: 700; font-size: 13.5px;
            cursor: pointer; font-family: 'DM Sans', sans-serif;
            display: inline-flex; align-items: center; gap: 8px;
            transition: background-color .15s, color .15s;
        }
        .btn-sair:hover { background-color: var(--text-main); color: var(--bg-card); }
        .btn-sair svg { width: 15px; height: 15px; stroke: currentColor; flex-shrink: 0; }

        .barra-topo-direita { display: flex; align-items: center; gap: 12px; }
        .barra-topo-direita #badgeSaldo { cursor: pointer; transition: transform .15s ease; }
        .barra-topo-direita #badgeSaldo:hover { transform: translateY(-2px); }

        /* ── Conteúdo principal ── */
        .wrapper {
            position: relative; z-index: 1; width: 100%; max-width: 980px;
            margin: 0 auto; padding: 28px 20px 0; text-align: center;
        }

        .cabecalho {
            background: var(--bg-card); border-radius: 24px; padding: 30px 40px;
            margin: 0 auto 36px; max-width: 560px;
            box-shadow: var(--sombra-card);
        }
        .saudacao {
            font-family: 'Caveat', cursive; font-size: 27px; font-weight: 600;
            color: #2a8f80; margin: 0 0 2px;
        }
        .cabecalho h1 { font-size: 27px; font-weight: 800; margin: 0; color: var(--text-main); }
        .cabecalho .sub { font-size: 14px; color: var(--text-muted); margin: 8px 0 0; }

        .grade {
            display: grid;
            grid-template-columns: repeat(3, 220px);
            justify-content: center;
            gap: 22px;
        }
        .grade-extra { margin-top: 22px; }

        .cartao {
            border: none; border-radius: 20px; padding: 26px 22px;
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            cursor: pointer; text-align: center; font-family: 'DM Sans', sans-serif;
            box-shadow: var(--sombra-cartao);
            transition: transform .18s ease, box-shadow .18s ease;
            width: 100%; color: var(--ink);
        }
        .cartao:hover { transform: translateY(-6px) scale(1.02); box-shadow: var(--sombra-cartao-hover); }

        .icone-caixa {
            width: 56px; height: 56px; border-radius: 16px; background: var(--icone-caixa-bg);
            display: flex; align-items: center; justify-content: center;
        }
        .icone-caixa svg { width: 28px; height: 28px; stroke: var(--ink); }
        .icone-caixa img { width: 28px; height: 28px; object-fit: contain; display: block; }

        .cartao .titulo { font-size: 16px; font-weight: 700; margin: 0; }
        .cartao .desc { font-size: 12.5px; color: rgba(22,50,61,0.7); margin: 0; line-height: 1.4; }

        .c-estudar { background: var(--baby-blue-ice); }
        .c-anotacoes { background: var(--pink-orchid); }
        .c-historico { background: var(--mauve); }
        .c-loja { background: var(--lemon-chiffon); grid-column: 2; }
        .c-admin { background: var(--celadon); grid-column: 3; }

        /* Quando existe o card de admin, a linha extra vira uma grade de
           2 colunas própria, pra o par Loja + Admin ficar centralizado
           de verdade (em vez de ocupar só as colunas 2-3 da grade de cima). */
        .grade-extra.tem-admin {
            grid-template-columns: repeat(2, 220px);
        }
        .grade-extra.tem-admin .c-loja { grid-column: 1; }
        .grade-extra.tem-admin .c-admin { grid-column: 2; }

        @media (max-width: 720px) {
            .grade { grid-template-columns: repeat(3, 160px); gap: 14px; }
            .grade-extra.tem-admin { grid-template-columns: repeat(2, 160px); }
        }
        @media (max-width: 560px) {
            .grade { grid-template-columns: 1fr; max-width: 260px; margin: 0 auto; }
            .grade-extra.tem-admin { grid-template-columns: 1fr; max-width: 260px; margin: 0 auto; }
            .c-loja, .c-admin { grid-column: 1; }
        }
        @media (max-width: 560px) {
            .barra-topo { flex-direction: column; align-items: stretch; gap: 14px; }
            .barra-topo-direita { justify-content: flex-end; }
        }
        @media (max-width: 520px) {
            .cabecalho { padding: 24px 24px; }
            .cartao { width: 100%; }
            .doodle { display: none; }
        }
    </style>
</head>
<body>
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>

    <span class="doodle d1"><svg viewBox="0 0 24 24" fill="#fff" opacity="0.9"><path d="M12 2l2.4 6.9L21 11l-6.6 2.1L12 20l-2.4-6.9L3 11l6.6-2.1z"/></svg></span>
    <span class="doodle d2"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg></span>
    <span class="doodle d3"><svg viewBox="0 0 24 24" fill="#fde4cf"><path d="M12 2l2.4 6.9L21 11l-6.6 2.1L12 20l-2.4-6.9L3 11l6.6-2.1z"/></svg></span>
    <span class="doodle d4"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 12h16M12 4v16"/></svg></span>
    <span class="doodle d5"><svg viewBox="0 0 24 24" fill="#f1c0e8"><circle cx="12" cy="12" r="10"/></svg></span>

    <div class="barra-topo">
        <button class="btn-sair" id="btnSair">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            Sair da conta
        </button>
        <div class="barra-topo-direita">
            <div id="badgeSaldo" onclick="window.location.href='/loja'"></div>
        </div>
    </div>

    <div class="wrapper">
        <div class="cabecalho">
            <p class="saudacao" id="saudacao">Olá!</p>
            <h1>O que vamos fazer hoje?</h1>
            <p class="sub">Escolha uma opção abaixo para continuar seus estudos.</p>
        </div>

        <div class="grade" id="grade">
            <button class="cartao c-estudar" onclick="location.href='/selecao'">
                <span class="icone-caixa">
                    <img src="/img/estudar.png" alt="">
                </span>
                <p class="titulo">Começar a estudar</p>
                <p class="desc">Escolha uma disciplina e comece agora.</p>
            </button>

            <button class="cartao c-anotacoes" onclick="location.href='/anotacoes'">
                <span class="icone-caixa">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg>
                </span>
                <p class="titulo">Minhas anotações</p>
                <p class="desc">Reveja o que você já anotou.</p>
            </button>

            <button class="cartao c-historico" onclick="location.href='/historico'">
                <span class="icone-caixa">
                    <img src="/img/historico.png" alt="">
                </span>
                <p class="titulo">Meu histórico</p>
                <p class="desc">Veja suas respostas anteriores.</p>
            </button>
        </div>

        <div class="grade grade-extra" id="gradeExtra">
            <button class="cartao c-loja" onclick="location.href='/loja'">
                <span class="icone-caixa">
                    <img src="/img/loja.png" alt="">
                </span>
                <p class="titulo">Loja Estelar</p>
                <p class="desc">Troque Estrelas por benefícios.</p>
            </button>
        </div>
    </div>

    <script>
        (async function carregarSaldoEstrelas() {
            const saldo = await window.Estrelas.buscarSaldoEstrelas();
            window.Estrelas.montarBadge(document.getElementById('badgeSaldo'), saldo);
        })();

        (async function carregarPerfil() {
            try {
                const res = await fetchAutenticado('/api/usuarios/perfil');
                const dados = await res.json();
                document.getElementById('saudacao').textContent = `Olá, ${dados.usuario.nome.split(' ')[0]}!`;

                if (dados.usuario.tipo === 'administrador') {
                    const gradeExtra = document.getElementById('gradeExtra');
                    gradeExtra.classList.add('tem-admin');
                    const botaoAdmin = document.createElement('button');
                    botaoAdmin.className = 'cartao c-admin';
                    botaoAdmin.innerHTML = `
                        <span class="icone-caixa">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
                        </span>
                        <p class="titulo">Gerenciamento do sistema</p>
                        <p class="desc">Área exclusiva de administrador.</p>
                    `;
                    botaoAdmin.onclick = () => location.href = '/admin';
                    gradeExtra.appendChild(botaoAdmin);
                }
            } catch (err) {
                // fetchAutenticado já redireciona pro /login em caso de 401
            }
        })();

        document.getElementById('btnSair').addEventListener('click', sair);
    </script>
</body>
</html>
