<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #00e1e1;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        
        .form-container h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 70px;
            color: #000;
            width: 1000px;
            font-size: 40px;
        }

        .form-container h2 {
            font-size: 34px;
            font-weight: 700;
            text-align: center;
            margin-top: 0;
            margin-bottom: 32px;
            color: #000;
            position: relative;
            display: inline-block;
        }

        .form-container h2::before {
            content: "";
            position: absolute;
            left: -1px;
            bottom: -2px;
            width: calc(30% + 700px);
            height: 55px;
            background-color: rgba(255, 255, 255, 0.658);
            z-index: -1;
            border-radius: 2px;
        }


        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 50px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #000;
        }

        input, select {
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #00b3b3;
        }

        .btn {
            grid-column: span 2;
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }

        button {
            width: 50%;
            padding: 14px;
            background-color: #22609b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #daa700;
        }

        input::placeholder,
        select {
            font-size: 15px;
        }

    </style>
</head>

<body>

    <div class="form-container">
        <h2 class="title">Cadastra-se aqui</h2>
        <form id="formCadastro">
            <div class="field">
                <input type="text" id="nome" placeholder="Nome de usuário" required>
            </div>
            <div class="field">
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="field">
                <input type="password" id="senha" placeholder="Senha" required>
            </div>
            <div class="field">
                <select id="grau_escolar" required>
                    <option value="" selected disabled>Grau escolar</option>
                    <option>Jardim I</option>
                    <option>Jardim II</option>
                    <option>1º ano</option>
                    <option>2º ano</option>
                    <option>3º ano</option>
                    <option>4º ano</option>
                    <option>5º ano</option>
                    <option>6º ano</option>
                    <option>7º ano</option>
                    <option>8º ano</option>
                    <option>9º ano</option>
                </select>
            </div>
            <div class="field">
                <input type="password" id="confirmarSenha" placeholder="Confirme sua senha" required>
            </div>
            <div class="field">
                <input type="date" id="data_nasc" required>
            </div>
            <div class="btn">
                <button type="submit">Cadastrar-se</button>
            </div>
        </form>
        <p id="mensagem" style="text-align:center; margin-top:16px; font-weight:600;"></p>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('formCadastro').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nome      = document.getElementById('nome').value.trim();
            const email     = document.getElementById('email').value.trim();
            const senha     = document.getElementById('senha').value;
            const confirmar = document.getElementById('confirmarSenha').value;
            const grau      = document.getElementById('grau_escolar').value;
            const data_nasc = document.getElementById('data_nasc').value;
            const msg       = document.getElementById('mensagem');

            // Validações na tela antes de chamar o banco
            if (!nome || !email || !senha || !grau || !data_nasc) {
                msg.style.color = 'red';
                msg.textContent = 'Preencha todos os campos obrigatórios.';
                return;
            }

            if (senha !== confirmar) {
                msg.style.color = 'red';
                msg.textContent = 'As senhas não coincidem.';
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                msg.style.color = 'red';
                msg.textContent = 'Informe um e-mail válido.';
                return;
            }

            try {
                const res = await fetch('/api/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome,
                        email,
                        senha,
                        grau_escolar: grau,
                        data_nasc,
                        tipo: 'aluno'
                    })
                });

                const dados = await res.json();

                if (res.ok) {
                    salvarSessao(dados.token, dados.usuario);
                    window.location.replace('/painel');
                } else {
                    msg.style.color = 'red';
                    // Mensagem vinda do backend (e-mail duplicado, senha em uso, etc.)
                    msg.textContent = dados.error;
                }
            } catch (err) {
                msg.style.color = 'red';
                msg.textContent = 'Não foi possível conectar ao servidor.';
            }
        });
    </script>

</body>
</html>
