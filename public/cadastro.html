<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro · LuminaSaber</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">

    <script src="/js/auth.js"></script>
    <script>redirecionarSeAutenticado();</script>

    <style>
        :root {
            --lemon-chiffon: #fbf8cc; --powder-petal: #fde4cf; --cotton-rose: #ffcfd2;
            --pink-orchid: #f1c0e8; --mauve: #cfbaf0; --baby-blue-ice: #a3c4f3;
            --frosted-blue: #90dbf4; --electric-aqua: #8eecf5; --aquamarine: #98f5e1;
            --celadon: #b9fbc0; --ink: #16323d; --red: #b00020; --green: #1a7f37;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0; min-height: 100vh; font-family: 'DM Sans', sans-serif;
            background: radial-gradient(circle at 20% 80%, #21e8e8 0%, #00e1e1 45%, #00cfcf 100%);
            display: flex; justify-content: center; align-items: center;
            padding: 40px 20px; color: var(--ink); position: relative; overflow-x: hidden;
        }

        .blob { position: fixed; border-radius: 50%; filter: blur(2px); opacity: 0.5; pointer-events: none; z-index: 0; }
        .blob.b1 { width: 240px; height: 240px; background: var(--powder-petal); top: -70px; right: -60px; }
        .blob.b2 { width: 190px; height: 190px; background: var(--aquamarine); bottom: -60px; left: -50px; }
        .blob.b3 { width: 130px; height: 130px; background: var(--pink-orchid); top: 14%; left: -40px; }

        .doodle { position: fixed; pointer-events: none; z-index: 0; opacity: .85; animation: flutuar 6s ease-in-out infinite; }
        .doodle svg { width: 100%; height: 100%; }
        .d1 { width: 26px; height: 26px; top: 10%; right: 14%; animation-duration: 5.5s; }
        .d2 { width: 22px; height: 22px; bottom: 20%; right: 16%; animation-duration: 7s; animation-delay: .4s; }
        .d3 { width: 30px; height: 30px; bottom: 10%; left: 12%; animation-duration: 6.4s; animation-delay: .9s; }
        @keyframes flutuar { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(8deg); } }

        .cartao {
            position: relative; z-index: 1;
            background: #fff; border-radius: 24px; padding: 40px 44px;
            width: min(94vw, 640px); box-shadow: 0 16px 36px rgba(0,0,0,0.16);
            text-align: center;
        }
        .cartao .kicker {
            font-family: 'Caveat', cursive; font-size: 24px; font-weight: 600;
            color: #2a8f80; margin: 0 0 2px;
        }
        .cartao h1 { font-size: 26px; font-weight: 800; margin: 0 0 28px; }

        form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; text-align: left; }
        .field { display: flex; flex-direction: column; }
        .field label { font-size: 12.5px; font-weight: 700; color: rgba(22,50,61,0.65); margin-bottom: 6px; }
        input, select {
            padding: 13px 15px; border-radius: 12px; border: 2px solid #e6ecee;
            font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
            background: #f7fafb; transition: border-color .15s, background-color .15s;
        }
        input:focus, select:focus { border-color: var(--baby-blue-ice); background: #fff; }

        /* ── Estado inválido: aparece só depois que o form tenta enviar
           (classe was-validated no <form>) ou quando a API aponta um
           campo específico (classe is-invalid direto no input). ── */
        .was-validated input:invalid,
        .was-validated select:invalid,
        input.is-invalid,
        select.is-invalid {
            border-color: var(--cotton-rose);
            background: #fff6f6;
        }
        .invalid-feedback {
            display: none; font-size: 12px; font-weight: 600; color: var(--red); margin-top: 5px;
        }
        .was-validated input:invalid ~ .invalid-feedback,
        .was-validated select:invalid ~ .invalid-feedback,
        input.is-invalid ~ .invalid-feedback,
        select.is-invalid ~ .invalid-feedback {
            display: block;
        }

        .btn-wrap { grid-column: span 2; display: flex; justify-content: center; margin-top: 8px; }
        button {
            padding: 14px 60px; background-color: var(--ink); color: #fff;
            border: none; border-radius: 999px; font-size: 15px; font-weight: 700;
            cursor: pointer; font-family: 'DM Sans', sans-serif; transition: opacity .2s;
        }
        button:hover { opacity: 0.85; }
        button:disabled { opacity: .6; cursor: not-allowed; }

        #mensagem { grid-column: span 2; text-align: center; margin: 4px 0 0; font-weight: 700; font-size: 13.5px; min-height: 18px; }

        .link-login { grid-column: span 2; text-align: center; margin-top: 4px; font-size: 13.5px; color: rgba(22,50,61,0.75); }
        .link-login a { color: var(--ink); font-weight: 700; text-decoration: underline; }

        /* ── Toast: só para erros que não pertencem a nenhum campo ──
        Escondido com "right" em pixel fixo (não com transform em %),
        porque quando o texto do erro ainda não foi definido a caixa
        fica estreita e translateX(120%) não desloca o suficiente —
        sobrava uma fatia vermelha visível no canto. ── */
        #liveToast {
            position: fixed; top: 20px; right: -420px; z-index: 50;
            background: #fff; border-left: 5px solid var(--red); border-radius: 12px;
            padding: 14px 18px; box-shadow: 0 12px 28px rgba(0,0,0,0.18);
            font-size: 13.5px; font-weight: 600; max-width: 320px;
            transition: right .25s ease;
        }
        #liveToast.visivel { right: 20px; }
        #liveToast strong { display: block; margin-bottom: 2px; font-size: 13px; color: var(--red); }

        @media (max-width: 560px) {
            form { grid-template-columns: 1fr; }
            .btn-wrap, #mensagem, .link-login { grid-column: span 1; }
        }
    </style>
</head>

<body>
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="doodle d1"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.4 6.9L21 11l-6.6 2.1L12 20l-2.4-6.9L3 11l6.6-2.1z"/></svg></span>
    <span class="doodle d2"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg></span>
    <span class="doodle d3"><svg viewBox="0 0 24 24" fill="#cfbaf0"><circle cx="12" cy="12" r="10"/></svg></span>

    <div class="cartao">
        <p class="kicker">Vamos começar!</p>
        <h1>Crie sua conta</h1>

        <form id="formCadastro" novalidate>
            <div class="field">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" minlength="2" required>
                <span class="invalid-feedback">Informe seu nome (pelo menos 2 caracteres).</span>
            </div>
            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="voce@email.com" required>
                <span class="invalid-feedback">Informe um e-mail válido.</span>
            </div>
            <div class="field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••" minlength="6" required>
                <span class="invalid-feedback">A senha deve ter pelo menos 6 caracteres.</span>
            </div>
            <div class="field">
                <label for="confirmarSenha">Confirme a senha</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="••••••••" required>
                <span class="invalid-feedback">As senhas precisam ser iguais.</span>
            </div>
            <div class="field">
                <label for="grau_escolar">Grau escolar</label>
                <select id="grau_escolar" name="grau_escolar" required>
                    <option value="" selected disabled>Selecione...</option>
                    <option>Jardim I</option>
                    <option>Jardim II</option>
                    <option>1º ano</option>
                    <option>2º ano</option>
                    <option>3º ano</option>
                    <option>4º ano</option>
                    <option>5º ano</option>
                    <option>6º ano</option>
                    <option>7º ano</option>
                    <option>8º ano</option>
                    <option>9º ano</option>
                </select>
                <span class="invalid-feedback">Selecione o grau escolar.</span>
            </div>
            <div class="field">
                <label for="data_nasc">Data de nascimento</label>
                <input type="date" id="data_nasc" name="data_nasc" max="" required>
                <span class="invalid-feedback">Informe uma data de nascimento válida.</span>
            </div>

            <div class="btn-wrap">
                <button type="submit" id="btnCadastrar">Cadastrar</button>
            </div>
            <p id="mensagem"></p>

            <p class="link-login">Já tem conta? <a href="/login">Entrar</a></p>
        </form>
    </div>

    <div id="liveToast" role="alert" aria-live="assertive" aria-atomic="true">
        <strong>Ops!</strong>
        <span id="liveToastTexto"></span>
    </div>

    <script>
        const form = document.getElementById('formCadastro');
        const msg = document.getElementById('mensagem');
        const btnCadastrar = document.getElementById('btnCadastrar');

        // Trava a data máxima em "hoje" — mesma regra que o back-end aplica
        // (data de nascimento não pode estar no futuro), mas já dá o retorno
        // ao usuário sem precisar de uma ida ao servidor.
        document.getElementById('data_nasc').max = new Date().toISOString().slice(0, 10);

        // Validação nativa (required, minlength, type="email") cobre a maior
        // parte dos campos. A confirmação de senha é uma regra que o HTML
        // sozinho não expressa, então usamos setCustomValidity pra que o
        // próprio navegador bloqueie o envio enquanto as duas não baterem —
        // igual ao padrão usado no restante do sistema.
        function validarConfirmacaoSenha() {
            const senha = form.senha.value;
            const confirmacao = form.confirmarSenha.value;

            if (confirmacao && senha !== confirmacao) {
                form.confirmarSenha.setCustomValidity('As senhas precisam ser iguais.');
            } else {
                form.confirmarSenha.setCustomValidity('');
            }
        }
        form.senha.oninput = validarConfirmacaoSenha;
        form.confirmarSenha.oninput = validarConfirmacaoSenha;

        // Assim que a pessoa mexe no e-mail de novo, tira o erro de
        // "e-mail já cadastrado" que a API pode ter colocado ali.
        form.email.oninput = () => {
            form.email.classList.remove('is-invalid');
            form.email.setCustomValidity('');
        };

        function showToast(texto) {
            const toast = document.getElementById('liveToast');
            document.getElementById('liveToastTexto').textContent = texto;
            toast.classList.add('visivel');
            setTimeout(() => toast.classList.remove('visivel'), 4500);
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            // A validação do navegador é só o primeiro filtro — dá retorno
            // instantâneo sem round-trip ao servidor. Quem garante os dados
            // de verdade é a API (Zod) e, por trás dela, o banco: o mesmo
            // formulário poderia ser enviado direto via curl/Postman, sem
            // passar pelo navegador, então a regra tem que existir nos dois
            // lugares — o front cuida da experiência, a API cuida da segurança.
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            const nome = form.nome.value.trim();
            const email = form.email.value.trim();
            const senha = form.senha.value;
            const grau_escolar = form.grau_escolar.value;
            const data_nasc = form.data_nasc.value;

            btnCadastrar.disabled = true;
            msg.textContent = '';

            try {
                const res = await fetch('/api/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha, grau_escolar, data_nasc }),
                });

                const dados = await res.json();

                if (res.ok) {
                    // O cadastro já devolve o token de sessão — evita pedir
                    // pra pessoa fazer login de novo logo em seguida.
                    salvarSessao(dados.token, dados.usuario);
                    msg.style.color = 'var(--green)';
                    msg.textContent = 'Cadastro realizado! Enviamos um e-mail de confirmação — redirecionando...';
                    setTimeout(() => window.location.replace('/painel'), 900);
                    return;
                }

                if (res.status === 409) {
                    // E-mail já cadastrado: erro pertence ao campo "email",
                    // então mostra ali (e não num toast genérico).
                    const erro = dados.error || 'Este e-mail já está cadastrado.';
                    form.email.setCustomValidity(erro);
                    form.email.classList.add('is-invalid');
                    const feedback = document.querySelector('#email ~ .invalid-feedback');
                    feedback.textContent = erro;
                    form.classList.add('was-validated');
                } else if (res.status === 400 && Array.isArray(dados.issues) && dados.issues.length > 0) {
                    // 400 do Zod: cada "issue" tem path (o campo) e message.
                    // Mostra a primeira mensagem relevante no toast — o
                    // usuário raramente vê isso, porque a validação nativa
                    // já bloqueia antes, mas cobre o caso de alguém burlar
                    // o HTML (ex.: reabrir um campo desabilitado via devtools).
                    showToast(dados.issues[0].message || 'Confira os dados informados.');
                } else {
                    showToast(dados.error || 'Não foi possível concluir o cadastro.');
                }
            } catch (err) {
                showToast('Não foi possível conectar ao servidor.');
            } finally {
                btnCadastrar.disabled = false;
            }
        });
    </script>
</body>
</html>
