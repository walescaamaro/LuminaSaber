<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuminaSaber – Relatório de Desempenho</title>
<script src="/js/auth.js"></script>
<script>protegerPagina();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal:      #00e1e1;
    --header-bg: rgba(255,255,255,0.45);
    --card-grad1: linear-gradient(135deg, #a78bfa, #6d28d9);
    --card-grad2: linear-gradient(135deg, #818cf8, #4338ca);
    --btn-dark:  #22609b;
    --btn-hover: #daa700;
    --green:     #16a34a;
    --red:       #dc2626;
  }

  body {
    min-height: 100vh;
    background-color: var(--teal);
    font-family: 'DM Sans', sans-serif;
    color: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    padding-bottom: 50px;
  }

  .wave { position: fixed; pointer-events: none; z-index: 0; }
  .wave-tl { top: -10px; left: -10px; width: clamp(140px, 25vw, 320px); }
  .wave-br { bottom: -10px; right: -10px; width: clamp(110px, 20vw, 260px); }

  .page-header {
    position: relative; z-index: 1; width: 100%;
    padding: 18px 24px;
    background: var(--header-bg);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .page-header h1 { font-size: clamp(18px, 2.8vw, 32px); font-weight: 700; }

  .btn-sair {
    background: var(--btn-dark); color: white;
    border: none; border-radius: 20px;
    padding: 8px 22px; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: background .2s;
    text-decoration: underline;
  }
  .btn-sair:hover { background: var(--btn-hover); }

  .body-wrap {
    z-index: 1; width: min(96%, 820px);
    display: flex; flex-direction: column;
    align-items: center; gap: 24px;
    margin-top: 28px;
  }

  .cards-row {
    display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
    width: 100%;
  }
  .card-stat {
    flex: 1; min-width: 200px; max-width: 280px;
    border-radius: 18px; padding: 28px 20px;
    color: white; text-align: center;
    box-shadow: 0 6px 24px rgba(0,0,0,0.15);
  }
  .card-stat.acertos  { background: var(--card-grad1); }
  .card-stat.percent  { background: var(--card-grad2); }
  .card-stat h2 { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
  .card-stat .valor { font-size: 42px; font-weight: 700; }

  .meta-wrap {
    width: 100%;
    background: rgba(255,255,255,0.5);
    border-radius: 16px;
    padding: 18px 24px;
  }
  .meta-wrap h3 { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
  .meta-bar-bg {
    width: 100%; height: 22px;
    background: rgba(255,255,255,0.6);
    border-radius: 20px; overflow: hidden;
  }
  .meta-bar-fill {
    height: 100%; border-radius: 20px;
    background: linear-gradient(90deg, #22609b, #a78bfa);
    transition: width 1s ease;
  }
  .meta-texto { margin-top: 8px; font-size: 14px; font-weight: 600; }

  .secao { width: 100%; }
  .secao-titulo {
    font-size: 18px; font-weight: 700;
    margin-bottom: 10px; padding-left: 4px;
  }
  .secao-titulo.forte { color: #065f46; }
  .secao-titulo.fraco { color: #7f1d1d; }

  .secao-box {
    background: rgba(255,255,255,0.85);
    border-radius: 14px;
    padding: 18px 22px;
    font-size: 15px; font-weight: 600;
    line-height: 1.7;
  }
  .secao-box.forte { border-left: 5px solid #16a34a; }
  .secao-box.fraco { border-left: 5px solid #dc2626; }

  .mat-row { display: flex; flex-direction: column; gap: 10px; }
  .mat-item { display: flex; align-items: center; gap: 12px; }
  .mat-nome { font-weight: 700; min-width: 110px; }
  .mat-mini-bar-bg {
    flex: 1; height: 12px; background: #ddd;
    border-radius: 10px; overflow: hidden;
  }
  .mat-mini-bar { height: 100%; border-radius: 10px; }
  .mat-mini-bar.forte { background: #16a34a; }
  .mat-mini-bar.fraco { background: #dc2626; }
  .mat-pct { font-size: 13px; font-weight: 700; min-width: 38px; text-align: right; }

  /* Texto da análise de IA, inserido dentro das caixas forte/fraco, abaixo das barras */
  .ia-analise {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(0,0,0,0.08);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.6;
    color: #2a2a2a;
  }

  .ia-loading { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(0,0,0,0.08); }
  .skeleton {
    height: 12px; border-radius: 8px;
    background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  .skeleton.s80  { width: 80%; }
  .skeleton.s95  { width: 95%; }
  .skeleton.s70  { width: 70%; }
  .skeleton.s60  { width: 60%; }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .ia-erro {
    color: #b91c1c; font-size: 13px; font-weight: 600;
    margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(0,0,0,0.08);
  }
  .btn-tentar-novo {
    margin-top: 10px; padding: 6px 16px; border-radius: 10px; border: none;
    background: #6d28d9; color: white; font-weight: 700; font-size: 13px;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
  }

  .btn-voltar {
    margin-top: 10px;
    padding: 14px 48px;
    background: var(--btn-dark); color: white;
    border: none; border-radius: 14px;
    font-size: 16px; font-weight: 700;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer; letter-spacing: .03em;
    transition: background .2s, transform .15s;
    text-decoration: underline;
  }
  .btn-voltar:hover { background: var(--btn-hover); transform: translateY(-2px); }
</style>
</head>
<body>

<svg class="wave wave-tl" viewBox="0 0 300 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M-10 280 C40 230,0 180,60 130 C120 80,180 100,240 60 C300 20,310 -20,310 -20 L-10 -20 Z" fill="white" opacity="0.55"/>
</svg>
<svg class="wave wave-br" viewBox="0 0 260 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M260 0 C220 30,270 80,200 120 C130 160,80 140,40 190 C0 240,-10 260,-10 260 L260 260 Z" fill="white" opacity="0.55"/>
</svg>

<header class="page-header">
  <h1>🎉 Você conseguiu! Estudo concluído.</h1>
  <button class="btn-sair" onclick="window.location.href='/painel'">SAIR</button>
</header>

<div class="body-wrap">

  <div class="cards-row">
    <div class="card-stat acertos">
      <h2>Acertos:</h2>
      <div class="valor" id="valAcertos">–/–</div>
    </div>
    <div class="card-stat percent">
      <h2>Percentual de acertos:</h2>
      <div class="valor" id="valPercent">–%</div>
    </div>
  </div>

  <div class="meta-wrap">
    <h3>📊 Meta de questões</h3>
    <div class="meta-bar-bg">
      <div class="meta-bar-fill" id="metaBarFill" style="width:0%"></div>
    </div>
    <p class="meta-texto" id="metaTexto">–</p>
  </div>

  <div class="secao">
    <p class="secao-titulo forte">💪 Pontos fortes:</p>
    <div class="secao-box forte">
      <div class="mat-row" id="fortesRow">
        <p style="opacity:.5">Calculando...</p>
      </div>
      <div class="ia-loading" id="loadingForte">
        <div class="skeleton s95"></div>
        <div class="skeleton s70"></div>
      </div>
      <div class="ia-analise" id="analiseForte" style="display:none;"></div>
    </div>
  </div>

  <div class="secao">
    <p class="secao-titulo fraco">📌 Áreas de melhoria:</p>
    <div class="secao-box fraco">
      <div class="mat-row" id="fracosRow">
        <p style="opacity:.5">Calculando...</p>
      </div>
      <div class="ia-loading" id="loadingFraco">
        <div class="skeleton s95"></div>
        <div class="skeleton s70"></div>
      </div>
      <div class="ia-analise" id="analiseFraco" style="display:none;"></div>
    </div>
  </div>

  <button class="btn-voltar" onclick="window.location.href='/selecao'">Estudar novamente</button>
</div>

<script>
  const resultados = JSON.parse(localStorage.getItem('resultadosQuestoes') || '[]');
  const meta       = parseInt(localStorage.getItem('metaQuestoes') || '0');
  const materias   = JSON.parse(localStorage.getItem('materias') || '[]');

  const totalResp  = resultados.length;
  const totalAcert = resultados.filter(r => r.acertou).length;
  const pct        = totalResp > 0 ? Math.round((totalAcert / totalResp) * 100) : 0;

  document.getElementById('valAcertos').textContent = `${totalAcert}/${totalResp}`;
  document.getElementById('valPercent').textContent = `${pct}%`;

  const progMeta = meta > 0 ? Math.min(100, Math.round((totalResp / meta) * 100)) : 0;
  setTimeout(() => {
    document.getElementById('metaBarFill').style.width = progMeta + '%';
  }, 200);

  const metaMsg = meta > 0
    ? `Você respondeu ${totalResp} de ${meta} questões (${progMeta}% da meta)`
    : `Você respondeu ${totalResp} questões`;
  document.getElementById('metaTexto').textContent = metaMsg;

  const stats = {};
  resultados.forEach(r => {
    if (!stats[r.materia]) stats[r.materia] = { acertos: 0, total: 0 };
    stats[r.materia].total++;
    if (r.acertou) stats[r.materia].acertos++;
  });

  const fortes = [];
  const fracos  = [];

  Object.entries(stats).forEach(([mat, s]) => {
    const p = s.total > 0 ? Math.round((s.acertos / s.total) * 100) : 0;
    if (p >= 60) fortes.push({ mat, p, acertos: s.acertos, total: s.total });
    else         fracos.push({ mat, p, acertos: s.acertos, total: s.total });
  });

  function renderMats(arr, tipo, containerId) {
    const el = document.getElementById(containerId);
    if (arr.length === 0) {
      el.innerHTML = tipo === 'forte'
        ? '<p>Continue praticando para identificar seus pontos fortes! 💪</p>'
        : '<p>Ótimo! Sem áreas críticas identificadas. 🎉</p>';
      return;
    }
    el.innerHTML = arr.map(({ mat, p, acertos, total }) => `
      <div class="mat-item">
        <span class="mat-nome">${mat}</span>
        <div class="mat-mini-bar-bg">
          <div class="mat-mini-bar ${tipo}" style="width:${p}%"></div>
        </div>
        <span class="mat-pct">${p}%</span>
      </div>
      <div style="font-size:12px; opacity:.6; padding-left:122px; margin-top:-6px;">
        ${acertos} acerto${acertos !== 1 ? 's' : ''} de ${total} questão${total !== 1 ? 'ões' : ''}
      </div>
    `).join('');
  }

  renderMats(fortes, 'forte', 'fortesRow');
  renderMats(fracos,  'fraco', 'fracosRow');

  async function gerarAnaliseIA() {
    const elLoadingForte = document.getElementById('loadingForte');
    const elLoadingFraco = document.getElementById('loadingFraco');
    const elAnaliseForte = document.getElementById('analiseForte');
    const elAnaliseFraco = document.getElementById('analiseFraco');

    function mostrarErro(msg, detalhe) {
      [elLoadingForte, elLoadingFraco].forEach(el => el.style.display = 'none');
      const erroHtml = `
        <div class="ia-erro">
          ⚠️ ${msg}
          <br><small style="opacity:.6">${detalhe || ''}</small>
          <br><button class="btn-tentar-novo" id="btnTentarNovo">Tentar novamente</button>
        </div>`;
      elAnaliseForte.style.display = 'block';
      elAnaliseForte.innerHTML = erroHtml;
      elAnaliseFraco.style.display = 'none';
      const btn = document.getElementById('btnTentarNovo');
      if (btn) btn.addEventListener('click', () => {
        elAnaliseForte.style.display = 'none';
        elLoadingForte.style.display = 'flex';
        elLoadingFraco.style.display = 'flex';
        gerarAnaliseIA();
      });
    }

    if (totalResp === 0) {
      mostrarErro('Nenhuma questão foi respondida nesta sessão.', '');
      return;
    }

    const apiKey = window.GEMINI_KEY;

    if (!apiKey) {
      mostrarErro('IA não configurada.', 'Adicione GEMINI_API_KEY no .env do servidor.');
      return;
    }

    const acertadas = resultados.filter(r => r.acertou);
    const erradas   = resultados.filter(r => !r.acertou);

    const listaAcertadas = acertadas.map(r =>
      `- [${r.materia} / ${r.nivel || 'N/A'}] ${r.enunciado}`
    ).join('\n');

    const listaErradas = erradas.map(r =>
      `- [${r.materia} / ${r.nivel || 'N/A'}] ${r.enunciado}\n  Escolheu: "${r.respostaEscolhida}" | Correta: "${r.respostaCorreta}"`
    ).join('\n');

    const prompt = `Você é um professor analisando o desempenho de um aluno. Fale como gente, tom de conversa, sem economês, sem "observa-se que".

RESUMO: ${totalResp} questões, ${totalAcert} acertos (${pct}%). Matérias: ${materias.length > 0 ? materias.join(', ') : 'Geral'}

ACERTOU:
${listaAcertadas || '(nenhuma)'}

ERROU:
${listaErradas || '(nenhuma)'}

Responda APENAS com JSON puro, sem markdown, neste formato:
{"forte": "texto", "fraco": "texto"}

forte: 2-3 frases citando o tema exato acertado e por que mostra entendimento. Se nada acertou, diga leve e incentive.
fraco: 2-3 frases citando o tema exato errado, hipótese rápida do motivo, e o que estudar primeiro. Se nada errou, parabenize.

Sem bullets, títulos ou aspas internas. Segunda pessoa (você). Português do Brasil, tom natural.`;

    // flash-lite primeiro: é o mais rápido da família Gemini, ótimo pra texto curto como esse
    const modelos = ['gemini-2.5-flash-lite', 'gemini-2.0-flash', 'gemini-2.5-flash'];
    const maxTentativasPorModelo = 1; // só repete o modelo se realmente necessário — já temos 3 modelos de fallback

    async function chamarGemini() {
      for (const modelo of modelos) {
        for (let tentativa = 1; tentativa <= maxTentativasPorModelo; tentativa++) {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${apiKey}`;

          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                  temperature: 0.7,
                  maxOutputTokens: 350,      // resposta curta = gerada mais rápido
                  thinkingConfig: { thinkingBudget: 0 } // desliga "pensamento" interno, que é a maior fonte de lentidão
                }
              })
            });

            if (response.ok) {
              return await response.json();
            }

            if (response.status === 503 || response.status === 429) {
              console.warn(`${modelo} sobrecarregado (tentativa ${tentativa})`);
              continue; // passa direto pro próximo modelo, sem esperar
            }

            const err = await response.json();
            throw new Error(err.error?.message || `Erro ${response.status}`);

          } catch (e) {
            if (e.message && !e.message.includes('fetch')) throw e;
          }
        }
      }
      throw new Error('Servidores do Gemini sobrecarregados no momento.');
    }

    try {
      const data = await chamarGemini();
      let texto = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';

      // Remove possíveis blocos de markdown ```json ... ```
      texto = texto.replace(/```json|```/g, '').trim();

      const json = JSON.parse(texto);

      elLoadingForte.style.display = 'none';
      elLoadingFraco.style.display = 'none';

      elAnaliseForte.style.display = 'block';
      elAnaliseForte.textContent = json.forte || 'Continue praticando para identificarmos seus pontos fortes!';

      elAnaliseFraco.style.display = 'block';
      elAnaliseFraco.textContent = json.fraco || 'Sem áreas críticas identificadas no momento.';

    } catch (erro) {
      console.error('Erro ao chamar API Gemini:', erro);
      mostrarErro('Os servidores do Gemini estão sobrecarregados agora. Isso é temporário.', erro.message);
    }
  }

  gerarAnaliseIA();
</script>
</body>
</html>
