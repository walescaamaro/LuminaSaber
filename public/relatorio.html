<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Desempenho · LuminaSaber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --lemon-chiffon: #fbf8cc; --powder-petal: #fde4cf; --cotton-rose: #ffcfd2;
    --pink-orchid: #f1c0e8; --mauve: #cfbaf0; --baby-blue-ice: #a3c4f3;
    --frosted-blue: #90dbf4; --electric-aqua: #8eecf5; --aquamarine: #98f5e1;
    --celadon: #b9fbc0; --ink: #16323d;
    --green: #1a7f37; --red: #b00020;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 30% 10%, #21e8e8 0%, #00e1e1 45%, #00cfcf 100%);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden; padding-bottom: 60px; position: relative;
  }

  .blob { position: fixed; border-radius: 50%; filter: blur(2px); opacity: .45; pointer-events: none; z-index: 0; }
  .blob.b1 { width: 240px; height: 240px; background: var(--mauve); top: -70px; left: -60px; }
  .blob.b2 { width: 200px; height: 200px; background: var(--lemon-chiffon); bottom: -60px; right: -60px; }

  .page-header {
    position: relative; z-index: 1; width: 100%; max-width: 860px;
    margin: 28px auto 0; padding: 20px 28px;
    background: #fff; border-radius: 20px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.14);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .page-header .titulo-wrap { display: flex; align-items: center; gap: 12px; }
  .page-header .icone-caixa {
    width: 44px; height: 44px; border-radius: 12px; background: var(--celadon);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .page-header .icone-caixa svg { width: 22px; height: 22px; stroke: var(--ink); }
  .page-header h1 { font-size: clamp(17px, 2.4vw, 24px); font-weight: 800; }

  .btn-sair {
    background: transparent; color: var(--ink); border: 2px solid var(--ink);
    border-radius: 999px; padding: 9px 22px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background-color .2s, color .2s;
    flex-shrink: 0;
  }
  .btn-sair:hover { background: var(--ink); color: #fff; }

  .body-wrap {
    position: relative; z-index: 1; width: min(96%, 860px);
    display: flex; flex-direction: column; align-items: center; gap: 22px;
    margin-top: 24px;
  }

  .cards-row { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .card-stat {
    flex: 1; min-width: 200px; max-width: 280px;
    border-radius: 20px; padding: 26px 20px;
    color: var(--ink); text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.10);
  }
  .card-stat.acertos { background: var(--baby-blue-ice); }
  .card-stat.percent { background: var(--pink-orchid); }
  .card-stat h2 { font-size: 14px; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: .04em; opacity: .75; }
  .card-stat .valor { font-size: 40px; font-weight: 800; }

  .meta-wrap { width: 100%; background: #fff; border-radius: 18px; padding: 20px 26px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
  .meta-wrap h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .meta-bar-bg { width: 100%; height: 18px; background: #eef2f3; border-radius: 20px; overflow: hidden; }
  .meta-bar-fill { height: 100%; border-radius: 20px; background: linear-gradient(90deg, var(--aquamarine), var(--baby-blue-ice)); transition: width 1s ease; }
  .meta-texto { margin-top: 10px; font-size: 13.5px; font-weight: 600; color: rgba(22,50,61,0.7); }

  .secao { width: 100%; }
  .secao-titulo { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin-bottom: 10px; padding-left: 4px; }
  .secao-titulo svg { width: 18px; height: 18px; }
  .secao-titulo.forte { color: var(--green); }
  .secao-titulo.fraco { color: var(--red); }

  .secao-box { background: #fff; border-radius: 16px; padding: 20px 24px; font-size: 14.5px; font-weight: 500; line-height: 1.7; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
  .secao-box.forte { border-left: 5px solid var(--celadon); }
  .secao-box.fraco { border-left: 5px solid var(--cotton-rose); }

  .mat-row { display: flex; flex-direction: column; gap: 10px; }
  .mat-item { display: flex; align-items: center; gap: 12px; }
  .mat-nome { font-weight: 700; min-width: 110px; }
  .mat-mini-bar-bg { flex: 1; height: 10px; background: #eef2f3; border-radius: 10px; overflow: hidden; }
  .mat-mini-bar { height: 100%; border-radius: 10px; }
  .mat-mini-bar.forte { background: var(--green); }
  .mat-mini-bar.fraco { background: var(--red); }
  .mat-pct { font-size: 12.5px; font-weight: 700; min-width: 36px; text-align: right; color: rgba(22,50,61,0.7); }

  .ia-analise {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(22,50,61,0.1);
    font-size: 14px; font-weight: 500; line-height: 1.6; color: #33505a;
  }

  .ia-loading { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(22,50,61,0.1); }
  .skeleton { height: 12px; border-radius: 8px; background: linear-gradient(90deg, #e6ecee 25%, #f2f6f7 50%, #e6ecee 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  .skeleton.s80 { width: 80%; } .skeleton.s95 { width: 95%; } .skeleton.s70 { width: 70%; } .skeleton.s60 { width: 60%; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .ia-erro { color: var(--red); font-size: 13px; font-weight: 600; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(22,50,61,0.1); }
  .btn-tentar-novo {
    margin-top: 10px; padding: 8px 18px; border-radius: 999px; border: none;
    background: var(--ink); color: white; font-weight: 700; font-size: 13px;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
  }

  .btn-voltar {
    margin-top: 8px; padding: 14px 48px; background: var(--ink); color: white;
    border: none; border-radius: 999px; font-size: 15px; font-weight: 700;
    font-family: 'DM Sans', sans-serif; cursor: pointer; transition: opacity .2s, transform .15s;
  }
  .btn-voltar:hover { opacity: 0.85; transform: translateY(-2px); }
</style>
</head>
<body>

<span class="blob b1"></span>
<span class="blob b2"></span>

<header class="page-header">
  <div class="titulo-wrap">
    <span class="icone-caixa">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
    </span>
    <h1>Você conseguiu! Estudo concluído.</h1>
  </div>
  <button class="btn-sair" onclick="window.location.href='/painel'">Sair</button>
</header>

<div class="body-wrap">

  <div class="cards-row">
    <div class="card-stat acertos">
      <h2>Acertos</h2>
      <div class="valor" id="valAcertos">–/–</div>
    </div>
    <div class="card-stat percent">
      <h2>Percentual de acertos</h2>
      <div class="valor" id="valPercent">–%</div>
    </div>
  </div>

  <div class="meta-wrap">
    <h3>Meta de questões</h3>
    <div class="meta-bar-bg">
      <div class="meta-bar-fill" id="metaBarFill" style="width:0%"></div>
    </div>
    <p class="meta-texto" id="metaTexto">–</p>
  </div>

  <div class="secao">
    <p class="secao-titulo forte">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.6 6.9L22 11l-7.4 2.1L12 20l-2.6-6.9L2 11l7.4-2.1z"/></svg>
      Pontos fortes
    </p>
    <div class="secao-box forte">
      <div class="mat-row" id="fortesRow">
        <p style="opacity:.5">Calculando...</p>
      </div>
      <div class="ia-loading" id="loadingForte">
        <div class="skeleton s80"></div>
        <div class="skeleton s60"></div>
      </div>
      <div class="ia-analise" id="analiseForte" style="display:none;"></div>
    </div>
  </div>

  <div class="secao">
    <p class="secao-titulo fraco">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10M12 6h.01"/><circle cx="12" cy="12" r="9"/></svg>
      Áreas de melhoria
    </p>
    <div class="secao-box fraco">
      <div class="mat-row" id="fracosRow">
        <p style="opacity:.5">Calculando...</p>
      </div>
      <div class="ia-loading" id="loadingFraco">
        <div class="skeleton s95"></div>
        <div class="skeleton s70"></div>
      </div>
      <div class="ia-analise" id="analiseFraco" style="display:none;"></div>
    </div>
  </div>

  <button class="btn-voltar" onclick="window.location.href='/selecao'">Estudar novamente</button>
</div>

<script>
  const resultados = JSON.parse(localStorage.getItem('resultadosQuestoes') || '[]');
  const meta       = parseInt(localStorage.getItem('metaQuestoes') || '0');
  const materias   = JSON.parse(localStorage.getItem('materias') || '[]');

  const totalResp  = resultados.length;
  const totalAcert = resultados.filter(r => r.acertou).length;
  const pct        = totalResp > 0 ? Math.round((totalAcert / totalResp) * 100) : 0;

  document.getElementById('valAcertos').textContent = `${totalAcert}/${totalResp}`;
  document.getElementById('valPercent').textContent = `${pct}%`;

  const progMeta = meta > 0 ? Math.min(100, Math.round((totalResp / meta) * 100)) : 0;
  setTimeout(() => {
    document.getElementById('metaBarFill').style.width = progMeta + '%';
  }, 200);

  const metaMsg = meta > 0
    ? `Você respondeu ${totalResp} de ${meta} questões (${progMeta}% da meta)`
    : `Você respondeu ${totalResp} questões`;
  document.getElementById('metaTexto').textContent = metaMsg;

  const stats = {};
  resultados.forEach(r => {
    if (!stats[r.materia]) stats[r.materia] = { acertos: 0, total: 0 };
    stats[r.materia].total++;
    if (r.acertou) stats[r.materia].acertos++;
  });

  const fortes = [];
  const fracos  = [];

  Object.entries(stats).forEach(([mat, s]) => {
    const p = s.total > 0 ? Math.round((s.acertos / s.total) * 100) : 0;
    if (p >= 60) fortes.push({ mat, p, acertos: s.acertos, total: s.total });
    else         fracos.push({ mat, p, acertos: s.acertos, total: s.total });
  });

  function renderMats(arr, tipo, containerId) {
    const el = document.getElementById(containerId);
    if (arr.length === 0) {
      el.innerHTML = tipo === 'forte'
        ? '<p>Continue praticando para identificar seus pontos fortes!</p>'
        : '<p>Ótimo! Sem áreas críticas identificadas.</p>';
      return;
    }
    el.innerHTML = arr.map(({ mat, p, acertos, total }) => `
      <div class="mat-item">
        <span class="mat-nome">${mat}</span>
        <div class="mat-mini-bar-bg">
          <div class="mat-mini-bar ${tipo}" style="width:${p}%"></div>
        </div>
        <span class="mat-pct">${p}%</span>
      </div>
      <div style="font-size:12px; opacity:.6; padding-left:122px; margin-top:-6px;">
        ${acertos} acerto${acertos !== 1 ? 's' : ''} de ${total} questão${total !== 1 ? 'ões' : ''}
      </div>
    `).join('');
  }

  renderMats(fortes, 'forte', 'fortesRow');
  renderMats(fracos,  'fraco', 'fracosRow');

  async function gerarAnaliseIA() {
    const elLoadingForte = document.getElementById('loadingForte');
    const elLoadingFraco = document.getElementById('loadingFraco');
    const elAnaliseForte = document.getElementById('analiseForte');
    const elAnaliseFraco = document.getElementById('analiseFraco');

    function mostrarErro(msg, detalhe) {
      [elLoadingForte, elLoadingFraco].forEach(el => el.style.display = 'none');
      const erroHtml = `
        <div class="ia-erro">
          ${msg}
          <br><small style="opacity:.6">${detalhe || ''}</small>
          <br><button class="btn-tentar-novo" id="btnTentarNovo">Tentar novamente</button>
        </div>`;
      elAnaliseForte.style.display = 'block';
      elAnaliseForte.innerHTML = erroHtml;
      elAnaliseFraco.style.display = 'none';
      const btn = document.getElementById('btnTentarNovo');
      if (btn) btn.addEventListener('click', () => {
        elAnaliseForte.style.display = 'none';
        elLoadingForte.style.display = 'flex';
        elLoadingFraco.style.display = 'flex';
        gerarAnaliseIA();
      });
    }

    if (totalResp === 0) {
      mostrarErro('Nenhuma questão foi respondida nesta sessão.', '');
      return;
    }

    const apiKey = window.GEMINI_KEY;

    if (!apiKey) {
      mostrarErro('IA não configurada.', 'Adicione GEMINI_API_KEY no .env do servidor.');
      return;
    }

    const acertadas = resultados.filter(r => r.acertou);
    const erradas   = resultados.filter(r => !r.acertou);

    const listaAcertadas = acertadas.map(r =>
      `- [${r.materia} / ${r.nivel || 'N/A'}] ${r.enunciado}`
    ).join('\n');

    const listaErradas = erradas.map(r =>
      `- [${r.materia} / ${r.nivel || 'N/A'}] ${r.enunciado}\n  Escolheu: "${r.respostaEscolhida}" | Correta: "${r.respostaCorreta}"`
    ).join('\n');

    const prompt = `Você é um professor analisando o desempenho de um aluno. Fale como gente, tom de conversa, sem economês, sem "observa-se que".

RESUMO: ${totalResp} questões, ${totalAcert} acertos (${pct}%). Matérias: ${materias.length > 0 ? materias.join(', ') : 'Geral'}

ACERTOU:
${listaAcertadas || '(nenhuma)'}

ERROU:
${listaErradas || '(nenhuma)'}

Responda APENAS com JSON puro, sem markdown, neste formato:
{"forte": "texto", "fraco": "texto"}

forte: 2-3 frases citando o tema exato acertado e por que mostra entendimento. Se nada acertou, diga leve e incentive.
fraco: 2-3 frases citando o tema exato errado, hipótese rápida do motivo, e o que estudar primeiro. Se nada errou, parabenize.

Sem bullets, títulos ou aspas internas. Segunda pessoa (você). Português do Brasil, tom natural.`;

    const modelos = ['gemini-2.5-flash-lite', 'gemini-2.0-flash', 'gemini-2.5-flash'];
    const maxTentativasPorModelo = 1;

    async function chamarGemini() {
      for (const modelo of modelos) {
        for (let tentativa = 1; tentativa <= maxTentativasPorModelo; tentativa++) {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${apiKey}`;

          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                  temperature: 0.7,
                  maxOutputTokens: 350,
                  thinkingConfig: { thinkingBudget: 0 }
                }
              })
            });

            if (response.ok) {
              return await response.json();
            }

            if (response.status === 503 || response.status === 429) {
              console.warn(`${modelo} sobrecarregado (tentativa ${tentativa})`);
              continue;
            }

            const err = await response.json();
            throw new Error(err.error?.message || `Erro ${response.status}`);

          } catch (e) {
            if (e.message && !e.message.includes('fetch')) throw e;
          }
        }
      }
      throw new Error('Servidores do Gemini sobrecarregados no momento.');
    }

    try {
      const data = await chamarGemini();
      let texto = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';

      texto = texto.replace(/```json|```/g, '').trim();

      const json = JSON.parse(texto);

      elLoadingForte.style.display = 'none';
      elLoadingFraco.style.display = 'none';

      elAnaliseForte.style.display = 'block';
      elAnaliseForte.textContent = json.forte || 'Continue praticando para identificarmos seus pontos fortes!';

      elAnaliseFraco.style.display = 'block';
      elAnaliseFraco.textContent = json.fraco || 'Sem áreas críticas identificadas no momento.';

    } catch (erro) {
      console.error('Erro ao chamar API Gemini:', erro);
      mostrarErro('Os servidores do Gemini estão sobrecarregados agora. Isso é temporário.', erro.message);
    }
  }

  gerarAnaliseIA();
</script>
</body>
</html>
