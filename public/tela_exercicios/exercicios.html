<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/tela_exercicios/css/style.css">
    <style>
        .meta-label { font-size: 12px; opacity: .6; font-weight: 700; letter-spacing: .05em; margin-bottom: 4px; }
        .materia-box.destaque { border: 2px solid #16a34a; color: #16a34a; font-weight: 700; }
        #avisoMeta {
            display: none; margin-top: 10px; padding: 8px 12px;
            background: #dcfce7; border-radius: 10px;
            color: #15803d; font-weight: 700; font-size: 13px;
            text-align: center; border: 1.5px solid #16a34a;
        }
        #tempoAviso {
            display: none; margin-top: 8px; text-align: center;
            color: #a00; font-weight: 700; font-size: 13px;
        }
        .cronometro-vermelho { color: #c00 !important; }
    </style>
</head>
<body>

<div class="container-fluid tela">
    <div class="row">

        <div class="col-12 col-lg-10 principal">
            <div class="topo">
                <input type="text" id="pesquisa" class="form-control" placeholder="Pesquise conteúdos ou perguntas específicas">
            </div>
            <h1>Exercícios</h1>
            <div id="listaQuestoes"></div>
        </div>

        <div class="col-12 col-lg-2 lateral">
            <h3>Matérias selecionadas</h3>
            <div id="materiasSelecionadas"></div>

            <h3 style="margin-top: 32px;">Questões respondidas</h3>
            <p class="meta-label" id="metaLabelTxt"></p>
            <div class="materia-box" id="contadorMeta" style="font-size: 22px; font-weight: 700;">0</div>
            <div id="avisoMeta">🎯 Meta atingida!</div>

            <h3 style="margin-top: 24px;">Tempo restante</h3>
            <div class="materia-box" id="cronometro" style="font-size: 22px; font-weight: 700; letter-spacing: 0.05em;">
                --:--:--
            </div>
            <div id="tempoAviso">⚠️ Tempo esgotado!</div>
        </div>

    </div>
</div>

<script type="module" src="/tela_exercicios/js/main.js"></script>

<script>
    // ── Label da meta ──
    const meta = parseInt(localStorage.getItem('metaQuestoes') || '0');
    if (meta > 0) {
        document.getElementById('metaLabelTxt').textContent = `META: ${meta} questões`;
    }

    // ── Observar quando meta é atingida ──
    const observer = new MutationObserver(() => {
        const el  = document.getElementById('contadorMeta');
        const val = parseInt(el.textContent.split('/')[0]) || 0;
        if (meta > 0 && val >= meta) {
            el.classList.add('destaque');
            document.getElementById('avisoMeta').style.display = 'block';
        }
    });
    observer.observe(document.getElementById('contadorMeta'), { childList: true, characterData: true, subtree: true });

    // ── Contagem regressiva ──
    (function () {
        const totalSegundos = parseInt(localStorage.getItem('tempoEstudoSegundos') || '0');
        const display = document.getElementById('cronometro');
        const aviso   = document.getElementById('tempoAviso');

        if (!totalSegundos || totalSegundos <= 0) {
            display.textContent = '--:--:--';
            return;
        }

        let restante = totalSegundos;

        function formatar(s) {
            const h   = Math.floor(s / 3600);
            const m   = Math.floor((s % 3600) / 60);
            const seg = s % 60;
            return [h, m, seg].map(v => String(v).padStart(2, '0')).join(':');
        }

        function tick() {
            display.textContent = formatar(restante);

            if (restante <= 60) display.classList.add('cronometro-vermelho');

            if (restante <= 0) {
                display.textContent = '00:00:00';
                aviso.style.display = 'block';
                clearInterval(timer);
                // Salva o que respondeu até agora e vai para o relatório
                setTimeout(() => { window.location.href = '/relatorio'; }, 2000);
                return;
            }
            restante--;
        }

        tick();
        const timer = setInterval(tick, 1000);
    })();
</script>

</body>
</html>
