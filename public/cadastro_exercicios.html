<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Questão · LuminaSaber</title>

    <script src="/js/auth.js"></script>
    <script>protegerPagina();</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --lemon-chiffon: #fbf8cc;
            --powder-petal: #fde4cf;
            --cotton-rose: #ffcfd2;
            --pink-orchid: #f1c0e8;
            --mauve: #cfbaf0;
            --baby-blue-ice: #a3c4f3;
            --frosted-blue: #90dbf4;
            --electric-aqua: #8eecf5;
            --aquamarine: #98f5e1;
            --celadon: #b9fbc0;
            --ink: #16323d;
            --red: #b00020;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; font-family: 'DM Sans', sans-serif;
            background-color: #00e1e1; padding: 32px 20px 60px; color: var(--ink);
        }

        .wrapper { max-width: 900px; margin: 0 auto; }

        .topo { margin-bottom: 24px; }
        .voltar {
            display: inline-block; font-weight: 700; font-size: 14px; color: var(--ink);
            text-decoration: none; background: #fff; border: 2px solid var(--ink);
            padding: 8px 18px; border-radius: 999px; transition: background-color .15s;
        }
        .voltar:hover { background-color: var(--lemon-chiffon); }

        .banner {
            background: #fff; border-radius: 20px; padding: 22px 32px; margin-bottom: 24px;
            box-shadow: 0 10px 26px rgba(0,0,0,0.12);
            display: flex; align-items: center; gap: 16px;
        }
        .banner .icone-caixa {
            width: 52px; height: 52px; border-radius: 16px; background: var(--aquamarine);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .banner .icone-caixa svg { width: 26px; height: 26px; stroke: var(--ink); }
        .banner h1 { margin: 0; font-size: 24px; font-weight: 800; }
        .banner p { margin: 4px 0 0; font-size: 13.5px; color: rgba(22,50,61,0.7); }

        .painel-form {
            background: #fff; border-radius: 20px; padding: clamp(22px, 4vw, 34px);
            box-shadow: 0 10px 26px rgba(0,0,0,0.12); margin-bottom: 32px;
        }

        form { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 32px; }
        .field { display: flex; flex-direction: column; }
        label { font-size: 13.5px; margin-bottom: 6px; font-weight: 700; }

        input, select {
            padding: 11px 14px; border: 1.5px solid #d7dee2; border-radius: 10px;
            font-size: 14.5px; font-family: 'DM Sans', sans-serif; color: var(--ink);
            background: #fff; transition: border-color .15s, box-shadow .15s;
        }
        input:focus, select:focus {
            outline: none; border-color: var(--frosted-blue);
            box-shadow: 0 0 0 3px rgba(144, 219, 244, 0.35);
        }
        input::placeholder { color: #9fadb3; }

        .full { grid-column: span 2; }
        .btn-linha { grid-column: span 2; display: flex; justify-content: center; margin-top: 6px; }

        button[type="submit"] {
            background: var(--ink); color: #fff; border: none;
            padding: 12px 30px; border-radius: 999px; cursor: pointer;
            font-weight: 700; font-family: 'DM Sans', sans-serif; font-size: 14.5px;
            transition: opacity .15s;
        }
        button[type="submit"]:hover { opacity: 0.85; }

        #mensagem { text-align: center; margin: 16px 0 0; font-weight: 700; font-size: 14px; }

        /* ── Tabela de listagem ── */
        .tabela-container {
            background: #fff; border-radius: 20px; padding: 24px clamp(18px, 3vw, 28px);
            box-shadow: 0 10px 26px rgba(0,0,0,0.12); overflow-x: auto;
        }
        .tabela-container h3 { margin: 0 0 16px; font-size: 16px; font-weight: 800; }

        table { width: 100%; min-width: 720px; border-collapse: collapse; }
        th {
            background: var(--pink-orchid); color: var(--ink);
            padding: 10px 12px; font-size: 12.5px; font-weight: 700;
            text-align: left; text-transform: uppercase; letter-spacing: .03em;
        }
        th:first-child { border-radius: 10px 0 0 10px; }
        th:last-child { border-radius: 0 10px 10px 0; }
        td { padding: 11px 12px; font-size: 13.5px; border-bottom: 1px solid #f0f2f3; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(144, 219, 244, 0.12); }

        .btn-editar, .btn-excluir {
            border: none; padding: 6px 14px; border-radius: 999px; cursor: pointer;
            font-size: 12px; font-weight: 700; font-family: 'DM Sans', sans-serif;
            transition: opacity .15s;
        }
        .btn-editar { background: var(--frosted-blue); color: var(--ink); margin-right: 4px; }
        .btn-excluir { background: var(--cotton-rose); color: var(--red); }
        .btn-editar:hover, .btn-excluir:hover { opacity: 0.8; }

        @media (max-width: 720px) {
            form { grid-template-columns: 1fr; gap: 16px; }
            .full, .btn-linha { grid-column: auto; }
            .banner { flex-direction: column; text-align: center; }
            button[type="submit"] { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="topo">
            <a href="/admin" class="voltar">&larr; Voltar ao gerenciamento</a>
        </div>

        <div class="banner">
            <span class="icone-caixa">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17h.01"/><path d="M9.5 9a2.5 2.5 0 015 0c0 1.5-2.5 2-2.5 4"/><circle cx="12" cy="12" r="9"/></svg>
            </span>
            <div>
                <h1>Nova Questão</h1>
                <p>Cadastre uma nova questão ou edite uma já existente.</p>
            </div>
        </div>

        <div class="painel-form">
            <form id="formQuestao">
                <div class="field">
                    <label>Enunciado</label>
                    <input type="text" id="enunciado" placeholder="Digite um enunciado..." required>
                </div>

                <div class="field">
                    <label>Alternativa D</label>
                    <input type="text" id="alternativa_D" placeholder="Digite algo..." required>
                </div>

                <div class="field">
                    <label>Alternativa A</label>
                    <input type="text" id="alternativa_A" placeholder="Digite algo..." required>
                </div>

                <div class="field">
                    <label>Alternativa Correta</label>
                    <select id="alternativa_correta" required>
                        <option value="" selected disabled>Selecione...</option>
                        <option value="a">A</option>
                        <option value="b">B</option>
                        <option value="c">C</option>
                        <option value="d">D</option>
                    </select>
                </div>

                <div class="field">
                    <label>Alternativa B</label>
                    <input type="text" id="alternativa_B" placeholder="Digite algo..." required>
                </div>

                <div class="field">
                    <label>Disciplina</label>
                    <select id="cod_disc" required>
                        <option value="82211">Matemática</option>
                        <option value="44457">Português</option>
                        <option value="76326">História</option>
                        <option value="98743">Geografia</option>
                        <option value="34512">Artes</option>
                        <option value="57713">Inglês</option>
                        <option value="90021">Ciências</option>
                    </select>
                </div>

                <div class="field">
                    <label>Alternativa C</label>
                    <input type="text" id="alternativa_C" placeholder="Digite algo..." required>
                </div>

                <div class="field">
                    <label>Nível de Dificuldade</label>
                    <select id="dificuldade" required>
                        <option value="" selected disabled>Selecione...</option>
                        <option value="fácil">fácil</option>
                        <option value="médio">médio</option>
                        <option value="difícil">difícil</option>
                    </select>
                </div>

                <div class="btn-linha">
                    <button type="submit">Cadastrar Questão</button>
                </div>
            </form>

            <p id="mensagem"></p>
        </div>

        <!-- Listagem das questões cadastradas -->
        <div class="tabela-container">
            <h3>Questões cadastradas</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Matéria</th>
                        <th>Enunciado</th>
                        <th>Dificuldade</th>
                        <th>Editar</th>
                        <th>Excluir</th>
                    </tr>
                </thead>
                <tbody id="tabelaQuestoes">
                    <tr><td colspan="6">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    const msg = document.getElementById('mensagem');
    let editandoId = null; // guarda o ID quando estiver editando

    // ── LISTAR ──────────────────────────────────────────────
    async function carregarTabela() {
        const tbody = document.getElementById('tabelaQuestoes');
        try {
            const res = await fetch('/api/questoes');
            const questoes = await res.json();

            if (questoes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">Nenhuma questão cadastrada ainda.</td></tr>';
                return;
            }

            tbody.innerHTML = questoes.map(q => `
                <tr>
                    <td>${q.id}</td>
                    <td>${q.materia}</td>
                    <td>${q.enunciado}</td>
                    <td>${q.nivel}</td>
                    <td><button class="btn-editar" onclick="editar(${q.id})">Editar</button></td>
                    <td><button class="btn-excluir" onclick="excluir(${q.id})">Excluir</button></td>
                </tr>
            `).join('');
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="6">Erro ao carregar questões.</td></tr>';
        }
    }

    // ── EDITAR: preenche o formulário com os dados da questão ──
    async function editar(id) {
        try {
            const res = await fetch(`/api/questoes/${id}`);
            const q = await res.json();

            document.getElementById('enunciado').value        = q.enunciado;
            document.getElementById('alternativa_A').value    = q.alternativas[0];
            document.getElementById('alternativa_B').value    = q.alternativas[1];
            document.getElementById('alternativa_C').value    = q.alternativas[2];
            document.getElementById('alternativa_D').value    = q.alternativas[3];
            document.getElementById('alternativa_correta').value = ['a','b','c','d'][q.correta];
            document.getElementById('dificuldade').value      = q.nivel;

            // Mapeia nome da matéria para cod_disc
            const mapaMateria = {
                'Matemática': '82211', 'Português': '44457', 'História': '76326',
                'Geografia': '98743', 'Artes': '34512', 'Inglês': '57713', 'Ciências': '90021'
            };
            document.getElementById('cod_disc').value = mapaMateria[q.materia] || '';

            editandoId = id;
            document.querySelector('button[type="submit"]').textContent = 'Salvar Alterações';
            msg.style.color = 'blue';
            msg.textContent = `Editando questão ID ${id}. Altere os campos e clique em Salvar.`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
            msg.style.color = 'red';
            msg.textContent = 'Erro ao carregar questão para edição.';
        }
    }

    // ── CADASTRAR / SALVAR EDIÇÃO ────────────────────────────
    document.getElementById('formQuestao').addEventListener('submit', async function(e) {
        e.preventDefault();

        const enunciado           = document.getElementById('enunciado').value.trim();
        const alternativa_A       = document.getElementById('alternativa_A').value.trim();
        const alternativa_B       = document.getElementById('alternativa_B').value.trim();
        const alternativa_C       = document.getElementById('alternativa_C').value.trim();
        const alternativa_D       = document.getElementById('alternativa_D').value.trim();
        const alternativa_correta = document.getElementById('alternativa_correta').value;
        const cod_disc            = document.getElementById('cod_disc').value;
        const dificuldade         = document.getElementById('dificuldade').value;

        if (!enunciado || !alternativa_A || !alternativa_B || !alternativa_C
            || !alternativa_D || !alternativa_correta || !cod_disc || !dificuldade) {
            msg.style.color = 'red';
            msg.textContent = 'Preencha todos os campos obrigatórios.';
            return;
        }

        const body = JSON.stringify({
            enunciado, alternativa_A, alternativa_B, alternativa_C, alternativa_D,
            alternativa_correta, cod_disc: Number(cod_disc), dificuldade
        });

        try {
            let res;

            if (editandoId) {
                // PUT — atualizar questão existente
                res = await fetchAutenticado(`/api/questoes/${editandoId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body
                });
            } else {
                // POST — nova questão
                res = await fetchAutenticado('/api/questoes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body
                });
            }

            const dados = await res.json();

            if (res.ok) {
                msg.style.color = 'green';
                msg.textContent = editandoId
                    ? `✓ Questão ${editandoId} atualizada com sucesso!`
                    : `✓ Questão cadastrada com sucesso! (ID: ${dados.id})`;
                editandoId = null;
                document.querySelector('button[type="submit"]').textContent = 'Cadastrar Questão';
                document.getElementById('formQuestao').reset();
                carregarTabela();
            } else {
                msg.style.color = 'red';
                msg.textContent = dados.error || 'Erro ao salvar questão.';
            }
        } catch (e) {
            msg.style.color = 'red';
            msg.textContent = 'Não foi possível conectar ao servidor.';
        }
    });

    // ── EXCLUIR ──────────────────────────────────────────────
    async function excluir(id) {
        if (!confirm(`Excluir questão ID ${id}?`)) return;

        try {
            const res = await fetchAutenticado(`/api/questoes/${id}`, { method: 'DELETE' });
            const dados = await res.json();

            if (res.ok) {
                msg.style.color = 'green';
                msg.textContent = ` ✓ Questão ${id} excluída.`;
                if (editandoId === id) {
                    editandoId = null;
                    document.querySelector('button[type="submit"]').textContent = 'Cadastrar Questão';
                    document.getElementById('formQuestao').reset();
                }
                carregarTabela();
            } else {
                msg.style.color = 'red';
                msg.textContent = dados.error || 'Erro ao excluir.';
            }
        } catch (e) {
            msg.style.color = 'red';
            msg.textContent = 'Não foi possível conectar ao servidor.';
        }
    }

    carregarTabela();
</script>

</body>
</html>
