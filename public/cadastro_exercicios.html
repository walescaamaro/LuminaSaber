<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Questão</title>

    <script src="/js/auth.js"></script>
    <script>protegerPagina();</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #00e1e1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'DM Sans', sans-serif;
            padding: 40px 20px;
        }
        .container {
            background: #fff;
            width: 900px;
            max-width: 100%;
            padding: clamp(22px, 4vw, 36px);
            border-radius: 8px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1);
        }
        .title { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; }
        .icon {
            background: #f4c430; color: white; width: 32px; height: 32px;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-weight: bold;
        }
        .title h2 { font-size: 25px; margin: 0; text-decoration: underline; }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 40px;
        }
        .field { display: flex; flex-direction: column; }
        label { font-size: 14.5px; margin-bottom: 5px; font-weight: bold; }
        input, select {
            padding: 10px 12px;
            border: 1px solid #b8c0c8;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
        }
        input:focus, select:focus {
            border-color: #1f5fa6;
            outline: 2px solid rgba(31, 95, 166, 0.16);
        }
        input::placeholder { color: #aaa; }
        .full { grid-column: span 2; }
        .btn { grid-column: span 2; display: flex; justify-content: center; margin-top: 15px; }
        button {
            background: #1f5fa6; color: white; border: none;
            padding: 11px 22px; border-radius: 8px; cursor: pointer;
            font-weight: bold; font-family: 'DM Sans', sans-serif; font-size: 15px;
        }
        button:hover { background: #174b85; }
        #mensagem { text-align: center; margin-top: 16px; font-weight: 600; font-size: 15px; }
        .voltar {
            margin-bottom: 16px;
            font-size: 13px;
            color: #1f5fa6;
            text-decoration: none;
            font-weight: 600;
        }
        .voltar:hover { text-decoration: underline; }

        /* Tabela de listagem */
        .tabela-container { width: 900px; max-width: 100%; margin-top: 32px; overflow-x: auto; }
        .tabela-container h3 { font-size: 18px; margin-bottom: 12px; }
        table { width: 100%; min-width: 720px; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 22px rgba(0, 0, 0, 0.08); }
        th { background: #1f5fa6; color: #fff; padding: 10px; font-size: 13px; text-align: left; }
        td { padding: 9px 10px; font-size: 13px; border-bottom: 1px solid #eee; }
        tr:last-child td { border-bottom: none; }
        .btn-excluir {
            background: #c0392b; color: #fff; border: none;
            padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .btn-excluir:hover { background: #96281b; }
        .btn-editar {
            background: #1f5fa6; color: #fff; border: none;
            padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
            margin-right: 4px;
        }
        .btn-editar:hover { background: #174b85; }

        @media (max-width: 720px) {
            body {
                justify-content: flex-start;
                padding: 24px 14px;
            }

            form {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .full,
            .btn {
                grid-column: auto;
            }

            .title h2 {
                font-size: 22px;
            }

            button[type="submit"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <a href="/admin" class="voltar">← Voltar ao gerenciamento</a>

    <div class="container">
        <div class="title">
            <div class="icon">?</div>
            <h2>Nova Questão</h2>
        </div>

        <form id="formQuestao">
            <div class="field">
                <label>Enunciado</label>
                <input type="text" id="enunciado" placeholder="Digite um enunciado..." required>
            </div>

            <div class="field">
                <label>Alternativa D</label>
                <input type="text" id="alternativa_D" placeholder="Digite algo..." required>
            </div>

            <div class="field">
                <label>Alternativa A</label>
                <input type="text" id="alternativa_A" placeholder="Digite algo..." required>
            </div>

            <div class="field">
                <label>Alternativa Correta</label>
                <select id="alternativa_correta" required>
                    <option value="" selected disabled>Selecione...</option>
                    <option value="a">A</option>
                    <option value="b">B</option>
                    <option value="c">C</option>
                    <option value="d">D</option>
                </select>
            </div>

            <div class="field">
                <label>Alternativa B</label>
                <input type="text" id="alternativa_B" placeholder="Digite algo..." required>
            </div>

            <div class="field">
                <label>Disciplina</label>
                <select id="cod_disc" required>
                    <option value="82211">Matemática</option>
                    <option value="44457">Português</option>
                    <option value="76326">História</option>
                    <option value="98743">Geografia</option>
                    <option value="34512">Artes</option>
                    <option value="57713">Inglês</option>
                    <option value="90021">Ciências</option>
                </select>
            </div>

            <div class="field">
                <label>Alternativa C</label>
                <input type="text" id="alternativa_C" placeholder="Digite algo..." required>
            </div>

            <div class="field">
                <label>Nível de Dificuldade</label>
                <select id="dificuldade" required>
                    <option value="" selected disabled>Selecione...</option>
                    <option value="fácil">fácil</option>
                    <option value="médio">médio</option>
                    <option value="difícil">difícil</option>
                </select>
            </div>

            <div class="btn">
                <button type="submit">Cadastrar Questão</button>
            </div>
        </form>

        <p id="mensagem"></p>
    </div>

    <!-- Listagem das questões cadastradas -->
    <div class="tabela-container">
    <h3>Questões cadastradas</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Matéria</th>
                <th>Enunciado</th>
                <th>Dificuldade</th>
                <th>Editar</th>
                <th>Excluir</th>
            </tr>
        </thead>
        <tbody id="tabelaQuestoes">
            <tr><td colspan="6">Carregando...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const msg = document.getElementById('mensagem');
    let editandoId = null; // guarda o ID quando estiver editando

    // ── LISTAR ──────────────────────────────────────────────
    async function carregarTabela() {
        const tbody = document.getElementById('tabelaQuestoes');
        try {
            const res = await fetch('/api/questoes');
            const questoes = await res.json();

            if (questoes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">Nenhuma questão cadastrada ainda.</td></tr>';
                return;
            }

            tbody.innerHTML = questoes.map(q => `
                <tr>
                    <td>${q.id}</td>
                    <td>${q.materia}</td>
                    <td>${q.enunciado}</td>
                    <td>${q.nivel}</td>
                    <td><button class="btn-editar" onclick="editar(${q.id})">Editar</button></td>
                    <td><button class="btn-excluir" onclick="excluir(${q.id})">Excluir</button></td>
                </tr>
            `).join('');
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="6">Erro ao carregar questões.</td></tr>';
        }
    }

    // ── EDITAR: preenche o formulário com os dados da questão ──
    async function editar(id) {
        try {
            const res = await fetch(`/api/questoes/${id}`);
            const q = await res.json();

            document.getElementById('enunciado').value        = q.enunciado;
            document.getElementById('alternativa_A').value    = q.alternativas[0];
            document.getElementById('alternativa_B').value    = q.alternativas[1];
            document.getElementById('alternativa_C').value    = q.alternativas[2];
            document.getElementById('alternativa_D').value    = q.alternativas[3];
            document.getElementById('alternativa_correta').value = ['a','b','c','d'][q.correta];
            document.getElementById('dificuldade').value      = q.nivel;

            // Mapeia nome da matéria para cod_disc
            const mapaMateria = {
                'Matemática': '82211', 'Português': '44457', 'História': '76326',
                'Geografia': '98743', 'Artes': '34512', 'Inglês': '57713', 'Ciências': '90021'
            };
            document.getElementById('cod_disc').value = mapaMateria[q.materia] || '';

            editandoId = id;
            document.querySelector('button[type="submit"]').textContent = 'Salvar Alterações';
            msg.style.color = 'blue';
            msg.textContent = `Editando questão ID ${id}. Altere os campos e clique em Salvar.`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
            msg.style.color = 'red';
            msg.textContent = 'Erro ao carregar questão para edição.';
        }
    }

    // ── CADASTRAR / SALVAR EDIÇÃO ────────────────────────────
    document.getElementById('formQuestao').addEventListener('submit', async function(e) {
        e.preventDefault();

        const enunciado           = document.getElementById('enunciado').value.trim();
        const alternativa_A       = document.getElementById('alternativa_A').value.trim();
        const alternativa_B       = document.getElementById('alternativa_B').value.trim();
        const alternativa_C       = document.getElementById('alternativa_C').value.trim();
        const alternativa_D       = document.getElementById('alternativa_D').value.trim();
        const alternativa_correta = document.getElementById('alternativa_correta').value;
        const cod_disc            = document.getElementById('cod_disc').value;
        const dificuldade         = document.getElementById('dificuldade').value;

        if (!enunciado || !alternativa_A || !alternativa_B || !alternativa_C
            || !alternativa_D || !alternativa_correta || !cod_disc || !dificuldade) {
            msg.style.color = 'red';
            msg.textContent = 'Preencha todos os campos obrigatórios.';
            return;
        }

        const body = JSON.stringify({
            enunciado, alternativa_A, alternativa_B, alternativa_C, alternativa_D,
            alternativa_correta, cod_disc: Number(cod_disc), dificuldade
        });

        try {
            let res;

            if (editandoId) {
                // PUT — atualizar questão existente
                res = await fetchAutenticado(`/api/questoes/${editandoId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body
                });
            } else {
                // POST — nova questão
                res = await fetchAutenticado('/api/questoes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body
                });
            }

            const dados = await res.json();

            if (res.ok) {
                msg.style.color = 'green';
                msg.textContent = editandoId
                    ? `✅ Questão ${editandoId} atualizada com sucesso!`
                    : `✅ Questão cadastrada com sucesso! (ID: ${dados.id})`;
                editandoId = null;
                document.querySelector('button[type="submit"]').textContent = 'Cadastrar Questão';
                document.getElementById('formQuestao').reset();
                carregarTabela();
            } else {
                msg.style.color = 'red';
                msg.textContent = dados.error || 'Erro ao salvar questão.';
            }
        } catch (e) {
            msg.style.color = 'red';
            msg.textContent = 'Não foi possível conectar ao servidor.';
        }
    });

    // ── EXCLUIR ──────────────────────────────────────────────
    async function excluir(id) {
        if (!confirm(`Excluir questão ID ${id}?`)) return;

        try {
            const res = await fetchAutenticado(`/api/questoes/${id}`, { method: 'DELETE' });
            const dados = await res.json();

            if (res.ok) {
                msg.style.color = 'green';
                msg.textContent = `✅ Questão ${id} excluída.`;
                if (editandoId === id) {
                    editandoId = null;
                    document.querySelector('button[type="submit"]').textContent = 'Cadastrar Questão';
                    document.getElementById('formQuestao').reset();
                }
                carregarTabela();
            } else {
                msg.style.color = 'red';
                msg.textContent = dados.error || 'Erro ao excluir.';
            }
        } catch (e) {
            msg.style.color = 'red';
            msg.textContent = 'Não foi possível conectar ao servidor.';
        }
    }

    carregarTabela();
</script>

</body>
</html>
